<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="assets/js/back-nav.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLM48 | Vote Results</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s192">
    <meta name="theme-color" content="#ffc0cb">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/glassmorphism.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Quicksand', 'Google Sans', sans-serif; color: #333; margin: 0; padding: 60px 0 50px; }
        body.glass-mesh-bg { background-color: #ffffff; background-image: none; }

        .top-navbar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .nav-back { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: #333; font-size: 20px; cursor: pointer; }
        .nav-title { font-weight: 600; font-size: 17px; color: #222; }

        .wrap { max-width: 640px; margin: 0 auto; }

        .ev-head { padding: 18px 12px 6px; }
        .ev-title { font-size: 19px; font-weight: 700; color: #111; line-height: 1.35; }
        .ev-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; color: #767676; }
        .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .chip.open { background: #e6f9ee; color: #1f9d55; }
        .chip.closed { background: #f1f1f1; color: #555; }
        .chip.upcoming { background: #fff4cc; color: #8a6d00; }
        .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

        .main-tabs { display: flex; gap: 34px; padding: 14px 12px 0; border-bottom: 1px solid #e6e6e6; }
        .main-tab { background: none; border: none; padding: 0 2px 14px; font-family: inherit; font-size: 15px; font-weight: 600; color: #767676; cursor: pointer; position: relative; }
        .main-tab span { position: relative; z-index: 1; }
        .main-tab.active { color: #111; }
        .main-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 13px; height: 5px; border-radius: 2px; background: #ffc107; }

        .round-pills { display: flex; gap: 8px; padding: 14px 12px 4px; overflow-x: auto; scrollbar-width: none; }
        .round-pills::-webkit-scrollbar { display: none; }
        .round-pill { flex: 0 0 auto; border: 1px solid #e6e6e6; background: #fff; color: #555; border-radius: 20px; padding: 7px 14px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .round-pill.active { background: #222; border-color: #222; color: #fff; }
        .round-pill .hidden-tag { font-size: 10.5px; margin-left: 4px; opacity: .75; }

        .sum-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; padding: 12px 12px 2px; }
        .sum-total { font-size: 22px; font-weight: 700; color: #111; font-variant-numeric: tabular-nums; }
        .sum-label { font-size: 12.5px; color: #767676; }
        .sum-diff { font-size: 12.5px; font-weight: 700; color: #1f9d55; }
        .sum-note { padding: 2px 12px 0; font-size: 12px; color: #767676; }

        .tier-head { display: flex; align-items: center; justify-content: space-between; margin: 20px 12px 6px; padding-bottom: 8px; border-bottom: 2px solid #ffc107; }
        .tier-name { font-size: 15px; font-weight: 700; color: #111; }
        .tier-range { font-size: 12px; color: #767676; font-weight: 600; }
        .tier-head.other { border-bottom-color: #e6e6e6; }

        .rank-list { padding: 0 12px; }
        .rank-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f3f3f3; }
        .rank-row:last-child { border-bottom: none; }
        .rank-col { flex: 0 0 34px; text-align: center; }
        .rank-no { font-weight: 700; font-size: 16px; color: #333; font-variant-numeric: tabular-nums; }
        .rank-row.r1 .rank-no { color: #f5a300; }
        .rank-row.r2 .rank-no { color: #8c8c8c; }
        .rank-row.r3 .rank-no { color: #b8732e; }
        .rank-chg { display: block; font-size: 10.5px; font-weight: 700; margin-top: 1px; white-space: nowrap; }
        .rank-chg.up { color: #1f9d55; }
        .rank-chg.down { color: #e03131; }
        .rank-chg.same { color: #767676; }
        .rank-chg.new { color: #f08c00; }
        .rank-img { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: #f4f4f4; }
        body.song-vote .rank-img { border-radius: 8px; }
        .rank-body { flex: 1; min-width: 0; }
        .rank-name { font-size: 14px; font-weight: 700; color: #111; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-bar { height: 5px; border-radius: 3px; background: #f3f3f3; margin-top: 6px; overflow: hidden; }
        .rank-bar > i { display: block; height: 100%; border-radius: 3px; background: #ffc107; }
        .rank-sub { font-size: 11.5px; color: #767676; margin-top: 4px; }
        .rank-votes { flex: 0 0 auto; text-align: right; font-weight: 700; font-size: 14px; color: #111; font-variant-numeric: tabular-nums; }
        .rank-votes i { font-size: 11px; margin-right: 3px; }
        .rank-pct { display: block; font-size: 11.5px; color: #767676; font-weight: 600; }

        /* Stats */
        .hero { margin: 14px 12px 0; padding: 16px 16px 14px; border-radius: 18px; background: linear-gradient(140deg, #fff9e3 0%, #ffefb3 100%); border: 1px solid #ffe08a; position: relative; overflow: hidden; }
        .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,193,7,.16); pointer-events: none; }
        .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
        .hero-k { font-size: 12.5px; color: #7a6000; font-weight: 600; }
        .live-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .6px; color: #1f9d55; background: #fff; padding: 3px 9px; border-radius: 20px; }
        .live-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .live-tag.ended { color: #767676; }
        .hero-v { display: flex; align-items: center; gap: 9px; margin-top: 8px; font-size: 30px; font-weight: 700; color: #111; line-height: 1.1; font-variant-numeric: tabular-nums; position: relative; z-index: 1; word-break: break-all; }
        .hero-v i { font-size: 22px; }
        .tk-ic { width: 1.1em; height: 1.1em; object-fit: contain; vertical-align: -0.18em; flex: 0 0 auto; }
        .hero-v .tk-ic { width: 32px; height: 32px; }
        .hero-unit { font-size: 12px; color: #7a6000; margin-top: 3px; font-weight: 600; position: relative; z-index: 1; }
        .hero-foot { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(122,96,0,.22); font-size: 11.5px; color: #7a6000; display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }

        .inc-grid { display: grid; grid-template-columns: 1fr 1fr; margin: 10px 12px 0; border: 1px solid #f0f0f0; border-radius: 16px; overflow: hidden; background: #fff; }
        .inc-cell { padding: 12px 14px; min-width: 0; }
        .inc-cell:nth-child(odd) { border-right: 1px solid #f3f3f3; }
        .inc-cell:nth-child(-n+2) { border-bottom: 1px solid #f3f3f3; }
        .inc-k { font-size: 11.5px; color: #767676; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .inc-k i { font-size: 11px; color: #f5a300; }
        .inc-v { font-size: 18px; font-weight: 700; color: #b5b5b5; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inc-v.plus { color: #1f9d55; }

        .sec-hint { font-size: 12px; color: #767676; margin: 0 12px 8px; }
        .card { margin: 14px 12px 0; border: 1px solid #f0f0f0; border-radius: 16px; background: #fff; padding: 14px 14px 12px; }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .card-title { font-size: 15px; font-weight: 700; color: #111; display: flex; align-items: center; gap: 7px; }
        .card-title i { color: #f5a300; font-size: 14px; }
        .card-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
        .card-hint { font-size: 11.5px; color: #767676; }
        .empty-mini { text-align: center; color: #999; font-size: 13px; padding: 26px 0 14px; }

        .tbl { width: 100%; margin-top: 6px; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
        .tbl th { text-align: left; font-size: 11px; color: #999; font-weight: 600; padding: 6px 2px 8px; border-bottom: 1px solid #eee; }
        .tbl td { padding: 9px 2px; border-bottom: 1px solid #f6f6f6; color: #333; }
        .tbl tr:last-child td { border-bottom: none; }
        .tbl th.r, .tbl td.r { text-align: right; }
        .tbl td.plus { color: #1f9d55; font-weight: 700; }
        .tbl td.zero { color: #b5b5b5; }
        .tbl tr.peak td { background: #fffaeb; }
        .tbl tr.peak td:first-child { border-radius: 8px 0 0 8px; }
        .tbl tr.peak td:last-child { border-radius: 0 8px 8px 0; }
        .peak-tag { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; color: #b37a00; background: #ffecb3; padding: 1px 6px; border-radius: 6px; vertical-align: 1px; }
        .tbl-more { display: block; width: 100%; margin-top: 6px; border: none; background: #fafafa; border-radius: 10px; padding: 9px; font-family: inherit; font-size: 12.5px; font-weight: 600; color: #555; cursor: pointer; }

        /* กราฟแท่งคะแนน */
        .seg { display: inline-flex; background: #f3f3f3; border-radius: 10px; padding: 3px; }
        .seg button { border: none; background: transparent; color: #767676; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        .seg button.active { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .seg.sm button { font-size: 11.5px; padding: 4px 10px; }
        .readout { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 12px; padding: 10px 12px; background: #fffaeb; border-radius: 12px; font-variant-numeric: tabular-nums; }
        .readout-l { font-size: 12px; color: #7a6000; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .readout-r { text-align: right; flex: 0 0 auto; }
        .readout-v { font-size: 17px; font-weight: 700; color: #1f9d55; }
        .readout-v.zero { color: #b5b5b5; }
        .readout-c { display: block; font-size: 11px; color: #767676; margin-top: 1px; }
        .chart { position: relative; display: flex; height: 160px; padding-left: 34px; margin-top: 22px; }
        .chart-grid { position: absolute; left: 34px; right: 0; top: 0; bottom: 0; pointer-events: none; }
        .chart-grid div { position: absolute; left: 0; right: 0; border-top: 1px dashed #eee; }
        .chart-grid span { position: absolute; left: -34px; width: 30px; text-align: right; top: -7px; font-size: 10px; color: #999; font-variant-numeric: tabular-nums; }
        .chart-bars { position: relative; flex: 1; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
        .chart-bar { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: pointer; position: relative; }
        .chart-bar i { display: block; width: 100%; background: #ffd54f; border-radius: 3px 3px 0 0; min-height: 1px; }
        .chart-bar.max i { background: #ffc107; }
        .chart-bar.sel i { background: #f5a300; }
        .chart-bar .peak { position: absolute; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 700; color: #111; white-space: nowrap; }
        .chart-x { display: flex; gap: 2px; padding-left: 34px; margin-top: 4px; }
        .chart-x span { flex: 1; min-width: 0; text-align: center; font-size: 10px; color: #999; white-space: nowrap; overflow: visible; }

        .notice { margin: 18px 12px 0; padding: 14px; border-radius: 14px; background: #f7f7f7; color: #666; font-size: 13.5px; line-height: 1.6; display: flex; gap: 10px; align-items: flex-start; }
        .notice i { font-size: 18px; margin-top: 2px; color: #767676; }
        .loading-view { text-align: center; color: #767676; padding: 50px 20px; font-size: 14px; }
        .updated-at { text-align: center; font-size: 11.5px; color: #767676; padding: 18px 12px 0; }
    </style>
</head>
<body class="glass-mesh-bg force-white-bg">

<div class="top-navbar">
    <button class="nav-back" type="button" title="Back" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="nav-title">Vote Results</div>
</div>

<div class="wrap">
    <div class="ev-head">
        <div class="ev-title" id="ev-title">&nbsp;</div>
        <div class="ev-meta" id="ev-meta"></div>
    </div>

    <div class="main-tabs" id="main-tabs" style="display:none;">
        <button type="button" class="main-tab active" data-tab="results" onclick="setTab('results')"><span>Results</span></button>
        <button type="button" class="main-tab" data-tab="stats" onclick="setTab('stats')"><span>Stats</span></button>
    </div>

    <div id="view"><div class="loading-view"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div></div>
    <div class="updated-at" id="updated-at"></div>
</div>

<script>
    const campaignId = new URLSearchParams(window.location.search).get('id');
    let data = null;
    let tab = 'results';
    let roundKey = null;          // 'live' หรือ 'cp:<id>'
    let refreshTimer = null;
    const REFRESH_MS = 60000;     // เปิดโหวตอยู่: รีเฟรชทุก 1 นาที (หยุดเมื่อสลับไปแอปอื่น)

    function goBack() { blm48Back(campaignId ? 'majorvote_detail?id=' + encodeURIComponent(campaignId) : 'majorvote'); }
    function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
    function fmtTime(ts, opts) {
        const d = new Date(ts);
        if (isNaN(d.getTime())) return '-';
        return d.toLocaleString('en-GB', Object.assign({ timeZone: 'Asia/Bangkok' }, opts || { dateStyle: 'medium', timeStyle: 'short' }));
    }
    function hm(ts) { return fmtTime(ts, { hour: '2-digit', minute: '2-digit' }); }
    function tokenIcon() {
        const t = String(data && data.tokenType || '').toLowerCase();
        // ใช้รูปเหรียญเดียวกับหน้า Wallet
        if (t === 'getoken') return '<img class="tk-ic" src="assets/images/getoken.png" alt="GE Token">';
        if (t === 'gift') return '<i class="fa-solid fa-gift" style="color:#ff69b4"></i>';
        return '<img class="tk-ic" src="assets/images/token.png" alt="Token">';
    }
    function tokenName() {
        const t = String(data && data.tokenType || '').toLowerCase();
        return t === 'getoken' ? 'GE Token' : t === 'gift' ? 'Points' : 'Token';
    }
    const isSong = () => data && data.voteKind === 'song';

    // ===== รอบผล: ผลด่วนที่ประกาศแล้ว (เรียงตามเวลา) + ล่าสุด/Final =====
    // แสดงเฉพาะผลที่ประกาศแล้วเท่านั้น (ทุกคนเห็นเหมือนกัน รวมแอดมิน):
    // ผลด่วนที่ยังไม่ publish และอันดับสดระหว่างเปิดโหวต จะไม่แสดง
    function rounds() {
        const list = (data.checkpoints || []).map((c, i) => ({
            key: 'cp:' + c.id,
            label: c.label || ('Update ' + (i + 1)),
            at: c.at, total: Number(c.totalVotes || 0), ranking: c.ranking || [], isPublic: c.isPublic !== false
        })).filter(r => r.isPublic);
        if (data.live && data.timeStatus === 'closed') {
            list.push({
                key: 'live', label: 'Final',
                at: data.endTime || data.serverTime,
                total: Number(data.liveTotal || 0), ranking: data.live
            });
        }
        return list;
    }
    const hasResults = () => !!data && rounds().length > 0;

    function setTab(t) {
        tab = t;
        document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
        render();
    }
    function setRound(k) { roundKey = k; render(); }
    let statsView = 'hourly';     // 'hourly' | 'daily' (จำไว้ในเครื่อง)
    try { if (localStorage.getItem('blm48_vote_stats_view') === 'daily') statsView = 'daily'; } catch (e) {}
    function setStatsView(v) {
        statsView = v;
        chartSel = null;
        tblExpanded = false;
        try { localStorage.setItem('blm48_vote_stats_view', v); } catch (e) {}
        render();
    }
    let chartMode = 'inc';        // 'inc' เพิ่มขึ้น | 'cum' สะสม
    let chartSel = null;          // แท่งที่แตะเลือก (null = แท่งล่าสุด)
    function setChartMode(m) { chartMode = m; render(); }
    function selBar(i) { chartSel = i; render(); }

    // ตัวเลขแกน Y แบบย่อ (1.2K, 3.4M)
    function shortNum(n) {
        const a = Math.abs(n);
        if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
        if (a >= 1e3) return (n / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
        return String(Math.round(n));
    }
    function niceMax(v) {
        if (v <= 0) return 1;
        const p = Math.pow(10, Math.floor(Math.log10(v)));
        const f = v / p;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    }

    // rows: [{label, xLabel, inc, cum}]
    function renderChart(rows) {
        if (!rows.length) return '<div class="empty-mini">No data yet</div>';
        rows = rows.slice().reverse();   // server ส่งใหม่สุดก่อน -> กราฟเรียงเก่า→ใหม่ ซ้าย→ขวา
        const key = chartMode === 'cum' ? 'cum' : 'inc';
        const vals = rows.map(r => Math.max(0, Number(r[key] || 0)));
        const top = niceMax(Math.max(...vals));
        const maxIdx = vals.indexOf(Math.max(...vals));
        const sel = chartSel != null && chartSel < rows.length ? chartSel : rows.length - 1;
        const step = Math.max(1, Math.ceil(rows.length / 6));   // ป้ายแกน X ไม่เกิน ~6 จุด

        let grid = '';
        [0, 0.5, 1].forEach(f => { grid += `<div style="bottom:${f * 100}%"><span>${shortNum(top * f)}</span></div>`; });

        const bars = rows.map((r, i) => {
            const h = vals[i] / top * 100;
            const peak = i === maxIdx && vals[i] > 0 ? `<span class="peak" style="bottom:calc(${h.toFixed(1)}% + 3px)">${fmt(vals[i])}</span>` : '';
            return `<div class="chart-bar ${i === maxIdx ? 'max' : ''} ${i === sel ? 'sel' : ''}" onclick="selBar(${i})" title="${escapeAttr(r.label)}">${peak}<i style="height:${h.toFixed(2)}%"></i></div>`;
        }).join('');
        const xs = rows.map((r, i) => `<span>${i % step === 0 ? escapeHtml(r.xLabel) : ''}</span>`).join('');
        const s = rows[sel];

        const sInc = Number(s.inc || 0);
        return `<div class="readout">
              <span class="readout-l">${escapeHtml(s.label)}</span>
              <span class="readout-r"><span class="readout-v ${sInc > 0 ? '' : 'zero'}">${sInc > 0 ? '+' : ''}${fmt(sInc)}</span><span class="readout-c">Total ${fmt(s.cum)}</span></span>
            </div>
            <div class="chart"><div class="chart-grid">${grid}</div><div class="chart-bars">${bars}</div></div>
            <div class="chart-x">${xs}</div>`;
    }

    // ตาราง: แสดง 8 แถวแรกก่อน กด "ดูทั้งหมด" เพื่อขยาย
    let tblExpanded = false;
    function toggleTbl() { tblExpanded = !tblExpanded; render(); }
    function renderTable(head, rows) {
        if (!rows.length) return '';
        const peak = Math.max(...rows.map(r => Number(r.inc || 0)));
        const LIMIT = 8;
        const shown = tblExpanded ? rows : rows.slice(0, LIMIT);
        const body = shown.map(r => {
            const inc = Number(r.inc || 0);
            const isPeak = peak > 0 && inc === peak;
            return `<tr class="${isPeak ? 'peak' : ''}"><td>${escapeHtml(r.label)}${isPeak ? '<span class="peak-tag">Peak</span>' : ''}</td><td class="r ${inc > 0 ? 'plus' : 'zero'}">${inc > 0 ? '+' + fmt(inc) : '0'}</td><td class="r">${fmt(r.cum)}</td></tr>`;
        }).join('');
        const more = rows.length > LIMIT
            ? `<button type="button" class="tbl-more" onclick="toggleTbl()">${tblExpanded ? 'Show less <i class="fa-solid fa-chevron-up"></i>' : 'Show all ' + rows.length + ' rows <i class="fa-solid fa-chevron-down"></i>'}</button>`
            : '';
        return `<div class="card">
            <div class="card-head"><div class="card-title"><i class="fa-solid fa-table-list"></i>${statsView === 'hourly' ? 'Hourly table' : 'Daily table'}</div></div>
            <table class="tbl"><thead><tr><th>${head}</th><th class="r">Added</th><th class="r">Total</th></tr></thead><tbody>${body}</tbody></table>
            ${more}
        </div>`;
    }

    function render() {
        const view = document.getElementById('view');
        if (data.timeStatus === 'upcoming') {
            view.innerHTML = `<div class="notice"><i class="fa-regular fa-clock"></i><div>Voting opens <b>${escapeHtml(fmtTime(data.startTime))}</b><br>Results and stats will appear once voting opens.</div></div>`;
            return;
        }
        // ยังไม่ประกาศผล: ไม่มีส่วน Results เลย แสดงแค่ Stats
        if (!hasResults()) tab = 'stats';
        view.innerHTML = tab === 'stats' ? renderStats() : renderResults();
    }

    function renderResults() {
        const rs = rounds();
        let html = '';
        if (!rs.length) return '';

        if (!roundKey || !rs.some(r => r.key === roundKey)) roundKey = rs[rs.length - 1].key;
        const idx = rs.findIndex(r => r.key === roundKey);
        const cur = rs[idx];
        const prev = idx > 0 ? rs[idx - 1] : null;

        if (rs.length > 1) {
            html += `<div class="round-pills">${rs.map(r => `<button type="button" class="round-pill ${r.key === roundKey ? 'active' : ''}" onclick="setRound('${r.key}')">${escapeHtml(r.label)}</button>`).join('')}</div>`;
        }

        // สรุปยอดรวม + เพิ่มจากรอบก่อน
        let diffHtml = '';
        if (prev && prev.total > 0) {
            const d = cur.total - prev.total;
            diffHtml = `<span class="sum-diff">+${fmt(d)} (${(d / prev.total * 100).toFixed(1)}%) since ${escapeHtml(prev.label)}</span>`;
        }
        html += `<div class="sum-row"><span class="sum-total">${tokenIcon()} ${fmt(cur.total)}</span><span class="sum-label">Total ${tokenName()}</span>${diffHtml}</div>`;
        html += `<div class="sum-note">As of ${escapeHtml(fmtTime(cur.at))}</div>`;

        // อันดับรอบก่อน ใช้ทำลูกศรขึ้น/ลง
        const prevRank = {};
        if (prev) prev.ranking.forEach(r => { prevRank[String(r.memberName).toLowerCase()] = Number(r.rank); });

        const ranking = cur.ranking.slice().sort((a, b) => Number(a.rank) - Number(b.rank));
        const maxVotes = Math.max(1, ...ranking.map(r => Number(r.votes || 0)));
        const rowHtml = (r, i) => {
            const rank = Number(r.rank);
            let chg = '';
            if (prev) {
                const p = prevRank[String(r.memberName).toLowerCase()];
                if (!p) chg = '<span class="rank-chg new">NEW</span>';
                else if (p > rank) chg = `<span class="rank-chg up"><i class="fa-solid fa-caret-up"></i> ${p - rank}</span>`;
                else if (p < rank) chg = `<span class="rank-chg down"><i class="fa-solid fa-caret-down"></i> ${rank - p}</span>`;
                else chg = '<span class="rank-chg same">–</span>';
            }
            const above = i > 0 ? ranking[i - 1] : null;
            const gap = above ? Number(above.votes || 0) - Number(r.votes || 0) : 0;
            const sub = above && gap > 0 ? `${fmt(gap)} behind #${escapeHtml(above.rank)}` : (i === 0 && ranking[1] ? `Leads #2 by ${fmt(Number(r.votes || 0) - Number(ranking[1].votes || 0))}` : '');
            const w = Math.max(0, Math.min(100, Number(r.votes || 0) / maxVotes * 100));
            return `
              <div class="rank-row ${rank <= 3 ? 'r' + rank : ''}">
                <div class="rank-col"><span class="rank-no">${escapeHtml(rank)}</span>${chg}</div>
                <img class="rank-img" src="${escapeAttr(r.profile || '')}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
                <div class="rank-body">
                  <div class="rank-name">${escapeHtml(r.memberName)}</div>
                  <div class="rank-bar"><i style="width:${w.toFixed(1)}%"></i></div>
                  ${sub ? `<div class="rank-sub">${sub}</div>` : ''}
                </div>
                <div class="rank-votes">${fmt(r.votes)}<span class="rank-pct">${Number(r.percentage || 0).toFixed(2)}%</span></div>
              </div>`;
        };

        // แบ่งตามกลุ่มอันดับของกิจกรรม (ไม่ได้ตั้ง = รายการเดียว)
        const tiers = (data.tiers || []).filter(t => t && t.name && Number(t.size) > 0);
        if (!tiers.length) {
            html += `<div class="rank-list" style="margin-top:10px;">${ranking.map(rowHtml).join('')}</div>`;
            return html;
        }
        let start = 1;
        const tierOf = rank => {
            let s = 1;
            for (let t = 0; t < tiers.length; t++) {
                const e = s + Number(tiers[t].size) - 1;
                if (rank >= s && rank <= e) return t;
                s = e + 1;
            }
            return -1;
        };
        tiers.forEach((t, ti) => {
            const end = start + Number(t.size) - 1;
            const rows = ranking.map((r, i) => ({ r, i })).filter(x => tierOf(Number(x.r.rank)) === ti);
            html += `<div class="tier-head"><span class="tier-name">${escapeHtml(t.name)}</span><span class="tier-range">${start === end ? '#' + start : '#' + start + '–' + end}</span></div>`;
            html += `<div class="rank-list">${rows.length ? rows.map(x => rowHtml(x.r, x.i)).join('') : '<div class="rank-sub" style="padding:8px 0;">-</div>'}</div>`;
            start = end + 1;
        });
        const rest = ranking.map((r, i) => ({ r, i })).filter(x => tierOf(Number(x.r.rank)) === -1);
        if (rest.length) {
            html += `<div class="tier-head other"><span class="tier-name">Other ranks</span><span class="tier-range">#${start}+</span></div>`;
            html += `<div class="rank-list">${rest.map(x => rowHtml(x.r, x.i)).join('')}</div>`;
        }
        return html;
    }

    function renderStats() {
        const s = data.stats;
        if (!s) return `<div class="notice"><i class="fa-solid fa-hourglass-half"></i><div>Stats will be shown after the results are announced.</div></div>`;
        const open = data.timeStatus === 'open';
        const plus = v => Number(v) > 0 ? '+' + fmt(v) : '0';
        const inc = (icon, k, v) => `<div class="inc-cell"><div class="inc-k"><i class="${icon}"></i>${k}</div><div class="inc-v ${Number(v) > 0 ? 'plus' : ''}">${plus(v)}</div></div>`;

        // การ์ดยอดรวม
        let html = `<div class="hero">
            <div class="hero-top">
              <span class="hero-k">Total votes</span>
              ${open ? '<span class="live-tag"><span class="dot"></span>LIVE</span>' : '<span class="live-tag ended"><span class="dot"></span>CLOSED</span>'}
            </div>
            <div class="hero-v">${tokenIcon()}<span>${fmt(s.total)}</span></div>
            <div class="hero-unit">${tokenName()}</div>
            ${s.lastVoteAt ? `<div class="hero-foot"><i class="fa-regular fa-clock"></i>Last vote ${escapeHtml(fmtTime(s.lastVoteAt))}</div>` : ''}
        </div>`;

        if (open) {
            html += `<div class="inc-grid">
                ${inc('fa-solid fa-bolt', 'Last 5 min', s.inc5m)}
                ${inc('fa-solid fa-stopwatch', 'Last 15 min', s.inc15m)}
                ${inc('fa-regular fa-hourglass-half', 'Last 1 hour', s.inc1h)}
                ${inc('fa-regular fa-calendar', 'Today', s.incToday)}
            </div>`;
        }

        const hourly = statsView === 'hourly';
        const rows = hourly
            ? (s.hourly || []).map(r => {
                const end = new Date(new Date(r.t).getTime() + 3600000);
                return {
                    label: fmtTime(r.t, { day: 'numeric', month: 'short' }) + ' ' + hm(r.t) + '-' + hm(end),
                    tLabel: fmtTime(r.t, { day: 'numeric', month: 'short' }) + ' ' + hm(r.t),
                    xLabel: hm(r.t), inc: r.inc, cum: r.cum
                };
            })
            : (s.daily || []).map(r => {
                const d = new Date(r.d + 'T00:00:00+07:00');
                return {
                    label: d.toLocaleDateString('en-GB', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short' }),
                    tLabel: d.toLocaleDateString('en-GB', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short', year: '2-digit' }),
                    xLabel: d.toLocaleDateString('en-GB', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'numeric' }),
                    inc: r.inc, cum: r.cum
                };
            });

        // การ์ดกราฟ: เลือกรายชั่วโมง/รายวัน + เพิ่มขึ้น/สะสม
        html += `<div class="card">
            <div class="card-head">
              <div class="card-title"><i class="fa-solid fa-chart-column"></i>Votes in</div>
              <div class="seg">
                <button type="button" class="${hourly ? 'active' : ''}" onclick="setStatsView('hourly')">Hourly</button>
                <button type="button" class="${!hourly ? 'active' : ''}" onclick="setStatsView('daily')">Daily</button>
              </div>
            </div>
            <div class="card-sub">
              <span class="card-hint">${hourly ? (open ? 'Last 24 hours' : 'Last 24 hours before close') : 'Since voting opened (Thai time)'}</span>
              <div class="seg sm">
                <button type="button" class="${chartMode !== 'cum' ? 'active' : ''}" onclick="setChartMode('inc')">Added</button>
                <button type="button" class="${chartMode === 'cum' ? 'active' : ''}" onclick="setChartMode('cum')">Total</button>
              </div>
            </div>
            ${renderChart(rows)}
        </div>`;

        html += renderTable(hourly ? 'Hour' : 'Date', rows.map(r => ({ label: r.tLabel, inc: r.inc, cum: r.cum })));
        return html;
    }

    function renderHead() {
        document.getElementById('ev-title').textContent = data.title || 'Major Vote';
        document.body.classList.toggle('song-vote', isSong());
        const st = data.timeStatus;
        const chip = st === 'open' ? '<span class="chip open"><span class="dot"></span>Voting open</span>'
                   : st === 'upcoming' ? '<span class="chip upcoming"><i class="fa-regular fa-clock"></i>Not open yet</span>'
                   : '<span class="chip closed"><i class="fa-solid fa-flag-checkered"></i>Voting closed</span>';
        const endTxt = data.endTime ? (st === 'closed' ? 'Closed ' : 'Closes ') + escapeHtml(fmtTime(data.endTime)) : '';
        document.getElementById('ev-meta').innerHTML = chip + (endTxt ? `<span>${endTxt}</span>` : '');
        // แถบ Results/Stats โชว์เฉพาะเมื่อมีผลประกาศแล้ว (ก่อนนั้นมีแต่ Stats)
        document.getElementById('main-tabs').style.display = (st === 'upcoming' || !hasResults()) ? 'none' : 'flex';
        if (!hasResults()) tab = 'stats';
        document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    }

    async function load() {
        try {
            const res = await blm48GetVoteResults(campaignId);
            if (!res || res.status !== 'success') {
                document.getElementById('view').innerHTML = `<div class="notice"><i class="fa-solid fa-circle-exclamation"></i><div>${escapeHtml((res && res.message) || 'Could not load data')}</div></div>`;
                return;
            }
            const firstLoad = !data;
            data = res;
            // เปิดหน้าครั้งแรกระหว่างโหวต และยังไม่มีผลด่วนประกาศ -> เริ่มที่แท็บ Stats
            if (firstLoad && location.hash !== '#results' && res.timeStatus === 'open' && !(res.checkpoints || []).some(c => c.isPublic !== false)) {
                tab = 'stats';
                document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            }
            renderHead();
            render();
            document.getElementById('updated-at').textContent = 'Updated ' + fmtTime(res.serverTime, { dateStyle: 'medium', timeStyle: 'medium' });
        } catch (e) {
            if (!data) document.getElementById('view').innerHTML = `<div class="notice"><i class="fa-solid fa-wifi"></i><div>Could not reach the server. Please try again.</div></div>`;
        }
        scheduleRefresh();
    }

    function scheduleRefresh() {
        clearTimeout(refreshTimer);
        if (!data || data.timeStatus === 'closed') return;   // ปิดโหวตแล้ว ผลไม่เปลี่ยน
        if (document.hidden) return;
        refreshTimer = setTimeout(load, REFRESH_MS);
    }
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearTimeout(refreshTimer);
        else if (data && data.timeStatus !== 'closed') load();
    });

    window.addEventListener('DOMContentLoaded', () => {
        if (!campaignId) { blm48Back('majorvote'); return; }
        if (location.hash === '#stats') tab = 'stats';
        document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        load();
    });
</script>
</body>
</html>
