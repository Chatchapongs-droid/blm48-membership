<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <script src="assets/js/back-nav.js"></script>
    <title>BLM48 Membership | Top Up Cookies</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/shop-orders.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        body { font-family: 'Quicksand', 'Kanit', sans-serif; background: #fff; }
        .nav-history-btn {
            position: absolute; right: 8px; bottom: 6px; height: 44px; padding: 0 8px;
            display: flex; align-items: center; gap: 6px; text-decoration: none;
            color: #222; font-size: 15px; font-weight: 500;
        }
        .nav-history-btn i { font-size: 18px; }

        .my-cookies { text-align: center; padding: 22px 12px 20px; border-bottom: 1px solid #efefef; }
        .my-cookies-label { font-size: 15px; color: #444; }
        .my-cookies-value {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 4px; font-size: 24px; font-weight: 700; color: #222;
        }
        .my-cookies-value img { width: 40px; height: 40px; object-fit: contain; }
        .my-tokens { margin-top: 6px; font-size: 12.5px; color: #767676; }

        .pack-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 12px;
            padding: 28px 12px 40px;
        }
        .pack { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .pack-img-wrap { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
        .pack-img-wrap::after {
            content: ''; position: absolute; bottom: 4px; left: 16%; right: 16%; height: 9px;
            border-radius: 50%; background: #efdcf3; z-index: 0;
        }
        .pack-img-wrap img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; }
        .pack-name { margin: 8px 0 8px; font-size: 14px; color: #333; }
        .pack-btn {
            width: 100%; border: none; border-radius: 999px; padding: 9px 6px; cursor: pointer;
            background: #f9d26b; color: #222; font-family: inherit; font-size: 14px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .pack-btn:active { transform: scale(0.97); }
        .pack-btn i { font-size: 13px; }
        .pack.is-selected .pack-btn { background: #222; color: #fff; }
        .pack-btn:disabled { background: #f1f1f3; color: #6b6b6b; box-shadow: none; cursor: not-allowed; }

        /* ยืนยันซื้อแบบในหน้า (ไม่ใช้ป๊อปอัป) */
        .buy-confirm { display: none; margin: 0 12px 24px; padding: 16px; border-radius: 16px; background: #fffaf0; border: 1px solid #f6e3ad; text-align: center; }
        .buy-confirm.show { display: block; }
        .buy-confirm-text { font-size: 15px; color: #222; }
        .buy-confirm-sub { margin-top: 4px; font-size: 12.5px; color: #6b6b6b; }
        .buy-confirm-actions { display: flex; gap: 8px; margin-top: 14px; }
        .buy-confirm-actions button { flex: 1; border-radius: 999px; padding: 11px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
        .buy-cancel { background: #fff; border: 1px solid #ddd; color: #444; }
        .buy-ok { background: #222; border: 1px solid #222; color: #fff; }
        .buy-ok:disabled { opacity: .6; cursor: not-allowed; }
        .buy-status { display: none; margin: 0 12px 20px; padding: 12px 14px; border-radius: 12px; font-size: 14px; text-align: center; }
        .buy-status.ok { display: block; background: #eaf7ee; color: #1f6b35; }
        .buy-status.err { display: block; background: #fff1f1; color: #b42318; }
    </style>
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="nav-back-btn" onclick="goBack()" aria-label="ย้อนกลับ"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="top-bar-page-title">Top Up Cookies</div>
    <a href="cookie_history" class="nav-history-btn"><i class="fa-solid fa-clock-rotate-left"></i>History</a>
</div>

<div class="page-wrapper">
    <div class="my-cookies">
        <div class="my-cookies-label">My Cookies</div>
        <div class="my-cookies-value"><img src="assets/images/cookies/cookie.png" alt=""><span id="my-cookies">0</span></div>
        <div class="my-tokens">Balance: <span id="my-tokens">0</span> Tokens</div>
    </div>

    <div class="pack-grid" id="pack-grid"></div>
    <div class="buy-status" id="buy-status" role="status"></div>
    <div class="buy-confirm" id="buy-confirm"></div></div>

<script>
    // แพ็กคุกกี้ (1 Token = 10 Cookies) ซื้อทันทีผ่าน RPC exchange_cookies: หัก Token + เพิ่ม Cookie + บันทึก 'แลกซื้อคุกกี้'
    const COOKIE_PACKS = [
        { tokens: 10,  cookies: 100,  img: 'assets/images/cookies/cookie.png' },
        { tokens: 100, cookies: 1000, img: 'assets/images/cookies/cookie-bag.png' },
    ];

    let user = null;
    let selected = null;   // index ของแพ็กที่กดเลือก (รอยืนยัน)
    let buying = false;

    function goBack() {
        blm48Back('profile');
    }

    function renderPacks() {
        document.getElementById('pack-grid').innerHTML = COOKIE_PACKS.map((p, i) => `
            <div class="pack${selected === i ? ' is-selected' : ''}">
                <div class="pack-img-wrap"><img src="${p.img}" alt=""></div>
                <div class="pack-name">${p.cookies.toLocaleString()} Cookies</div>
                <button type="button" class="pack-btn" onclick="selectPack(${i})" ${buying ? 'disabled' : ''}><i class="fas fa-coins"></i> ${p.tokens.toLocaleString()} Tokens</button>
            </div>`).join('');
    }

    function renderBalance() {
        document.getElementById('my-cookies').textContent = Number(user.cookie || 0).toLocaleString();
        document.getElementById('my-tokens').textContent = Number(user.token || 0).toLocaleString();
    }

    function setStatus(type, html) {
        const el = document.getElementById('buy-status');
        el.className = 'buy-status' + (type ? ' ' + type : '');
        el.innerHTML = html || '';
    }

    function renderConfirm() {
        const box = document.getElementById('buy-confirm');
        const p = COOKIE_PACKS[selected];
        if (!p) { box.classList.remove('show'); box.innerHTML = ''; return; }
        const short = Number(user.token || 0) < p.tokens;
        box.innerHTML = `
            <div class="buy-confirm-text">ซื้อ <b>${p.cookies.toLocaleString()} Cookies</b> ด้วย <b>${p.tokens.toLocaleString()} Tokens</b>?</div>
            <div class="buy-confirm-sub">${short ? 'Token ไม่พอ (มี ' + Number(user.token || 0).toLocaleString() + ' Tokens)' : 'คุกกี้เข้ากระเป๋าทันที'}</div>
            <div class="buy-confirm-actions">
                <button type="button" class="buy-cancel" onclick="selectPack(null)">ยกเลิก</button>
                <button type="button" class="buy-ok" id="buy-ok" onclick="confirmBuy()" ${short || buying ? 'disabled' : ''}>ยืนยันซื้อ</button>
            </div>`;
        box.classList.add('show');
    }

    function selectPack(i) {
        if (buying) return;
        selected = (i === null || selected === i) ? null : i;
        setStatus('', '');
        renderPacks();
        renderConfirm();
    }

    // ซื้อทันที: Token ถูกหัก คุกกี้เข้ากระเป๋าเลย (ไม่ผ่านตะกร้า/Redeem)
    async function confirmBuy() {
        const p = COOKIE_PACKS[selected];
        if (!p || buying) return;
        buying = true;
        const btn = document.getElementById('buy-ok');
        if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; }
        try {
            const res = await blm48ExchangeCookies(user.username, p.tokens);
            if (!res || res.status !== 'success') throw new Error((res && res.message) || 'ซื้อไม่สำเร็จ กรุณาลองใหม่อีกครั้งค่ะ');
            user.token = res.newToken;
            user.cookie = res.newCookie;
            saveUserSession(user);
            selected = null;
            renderBalance();
            setStatus('ok', `<i class="fa-solid fa-circle-check"></i> ได้รับ <b>${p.cookies.toLocaleString()} Cookies</b> เข้ากระเป๋าแล้ว`);
        } catch (e) {
            setStatus('err', escapeHtml(e.message || 'ซื้อไม่สำเร็จ'));
        } finally {
            buying = false;
            renderPacks();
            renderConfirm();
        }
    }

    async function refreshBalance() {
        try {
            const wallet = await blm48GetWallet(user.username);
            if (wallet && wallet.token !== undefined) {
                user.token = wallet.token;
                user.cookie = wallet.cookie;
                user.geToken = wallet.geToken;
                user.fanCookies = wallet.fanCookies;
                saveUserSession(user);
                renderBalance();
            }
        } catch (e) { console.error('refreshBalance error:', e); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        user = getUserSession();
        if (!user) { window.location.href = 'login'; return; }
        renderPacks();
        renderBalance();
        refreshBalance();
    });
</script>
</body>
</html>
