<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <script src="assets/js/back-nav.js"></script>
    <title>BLM48 Membership | Top Up Cookies</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/shop-orders.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        body { font-family: 'Quicksand', 'Kanit', sans-serif; background: #fff; }
        .nav-history-btn {
            position: absolute; right: 8px; bottom: 6px; height: 44px; padding: 0 8px;
            display: flex; align-items: center; gap: 6px; text-decoration: none;
            color: #222; font-size: 15px; font-weight: 500;
        }
        .nav-history-btn i { font-size: 18px; }

        .my-cookies { text-align: center; padding: 22px 12px 20px; border-bottom: 1px solid #efefef; }
        .my-cookies-label { font-size: 15px; color: #444; }
        .my-cookies-value {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 4px; font-size: 24px; font-weight: 700; color: #222;
        }
        .my-cookies-value img { width: 40px; height: 40px; object-fit: contain; }
        .my-tokens { margin-top: 6px; font-size: 12.5px; color: #767676; }

        .pack-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px 12px;
            padding: 28px 12px 40px;
        }
        .pack { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .pack-img-wrap { position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
        .pack-img-wrap img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; }
        .pack-name { margin: 8px 0 8px; font-size: 14px; color: #333; }
        .pack-btn {
            width: 100%; border: none; border-radius: 999px; padding: 9px 6px; cursor: pointer;
            background: #f9d26b; color: #222; font-family: inherit; font-size: 14px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .pack-btn:active { transform: scale(0.97); }
        .pack-btn i { font-size: 13px; }
        .pack.is-selected .pack-btn { background: #222; color: #fff; }
        .pack-btn:disabled { background: #f1f1f3; color: #6b6b6b; box-shadow: none; cursor: not-allowed; }

        /* Bottom Sheet ยืนยันซื้อ (ข้อความภาษาอังกฤษเท่านั้น) */
        .buy-overlay {
            position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.38);
            opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s;
        }
        .buy-overlay.show { opacity: 1; visibility: visible; }
        .buy-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 3001;
            max-width: 560px; margin: 0 auto; background: #fff;
            border-radius: 20px 20px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
            transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
            font-family: 'Quicksand', 'Kanit', sans-serif;
        }
        .buy-sheet.show { transform: translateY(0); }
        .buy-sheet-handle { width: 40px; height: 4px; border-radius: 4px; background: #ddd; margin: 0 auto 12px; }
        .buy-sheet-title { text-align: center; font-size: 16px; font-weight: 700; color: #222; }
        .buy-sheet-item { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; }
        .buy-sheet-item img { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
        .buy-sheet-item-name { font-size: 17px; font-weight: 700; color: #222; }
        .buy-sheet-item-sub { font-size: 13px; color: #767676; margin-top: 2px; }
        .buy-sheet-rows { margin: 12px 0 4px; border-top: 1px solid #f0f0f0; }
        .buy-sheet-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #555; }
        .buy-sheet-row b { color: #222; font-weight: 700; }
        .buy-sheet-row b.neg { color: #b42318; }
        .buy-sheet-note { margin-top: 10px; font-size: 13px; text-align: center; color: #767676; }
        .buy-sheet-note.err { color: #b42318; }
        .buy-sheet-actions { display: flex; gap: 8px; margin-top: 16px; }
        .buy-sheet-actions button { flex: 1; border-radius: 999px; padding: 12px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
        .buy-cancel { background: #fff; border: 1px solid #ddd; color: #444; }
        .buy-ok { background: #222; border: 1px solid #222; color: #fff; }
        .buy-ok:disabled { opacity: .5; cursor: not-allowed; }
        .buy-done { text-align: center; padding: 10px 0 2px; }
        .buy-done-icon { font-size: 44px; color: #2e9e55; }
        .buy-done-title { margin-top: 8px; font-size: 17px; font-weight: 700; color: #222; }
        .buy-done-sub { margin-top: 4px; font-size: 13.5px; color: #767676; }
    </style>
</head>
<body>

<div class="top-navigation-bar">
    <button type="button" class="nav-back-btn" onclick="goBack()" aria-label="ย้อนกลับ"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="top-bar-page-title">Top Up Cookies</div>
    <a href="cookie_history" class="nav-history-btn"><i class="fa-solid fa-clock-rotate-left"></i>History</a>
</div>

<div class="page-wrapper">
    <div class="my-cookies">
        <div class="my-cookies-label">My Cookies</div>
        <div class="my-cookies-value"><img src="assets/images/cookies/cookie-icon.svg" alt=""><span id="my-cookies">0</span></div>
        <div class="my-tokens">Balance: <span id="my-tokens">0</span> Tokens</div>
    </div>

    <div class="pack-grid" id="pack-grid"></div>
</div>

<div class="buy-overlay" id="buy-overlay" onclick="closeSheet()"></div>
<div class="buy-sheet" id="buy-sheet" role="dialog" aria-modal="true" aria-labelledby="buy-sheet-title"></div>

<script>
    // แพ็กคุกกี้ (1 Token = 10 Cookies) ซื้อทันทีผ่าน RPC exchange_cookies: หัก Token + เพิ่ม Cookie + บันทึก 'แลกซื้อคุกกี้'
    const COOKIE_PACKS = [
        { tokens: 10,  cookies: 100,  img: 'assets/images/cookies/pack-1.svg' },
        { tokens: 100, cookies: 1000, img: 'assets/images/cookies/pack-8.svg' },
    ];

    let user = null;
    let selected = null;   // index ของแพ็กที่กดเลือก (รอยืนยัน)
    let buying = false;

    function goBack() {
        blm48Back('profile');
    }

    function renderPacks() {
        document.getElementById('pack-grid').innerHTML = COOKIE_PACKS.map((p, i) => `
            <div class="pack${selected === i ? ' is-selected' : ''}">
                <div class="pack-img-wrap"><img src="${p.img}" alt=""></div>
                <div class="pack-name">${p.cookies.toLocaleString()} Cookies</div>
                <button type="button" class="pack-btn" onclick="selectPack(${i})" ${buying ? 'disabled' : ''}><i class="fas fa-coins"></i> ${p.tokens.toLocaleString()} Tokens</button>
            </div>`).join('');
    }

    function renderBalance() {
        document.getElementById('my-cookies').textContent = Number(user.cookie || 0).toLocaleString();
        document.getElementById('my-tokens').textContent = Number(user.token || 0).toLocaleString();
    }

    // Bottom Sheet ยืนยันซื้อ — ข้อความในชีตเป็นภาษาอังกฤษทั้งหมด
    function renderSheet(errMsg) {
        const sheet = document.getElementById('buy-sheet');
        const p = COOKIE_PACKS[selected];
        if (!p) return;
        const bal = Number(user.token || 0);
        const after = bal - p.tokens;
        const short = after < 0;
        const note = errMsg
            ? `<div class="buy-sheet-note err"><i class="fa-solid fa-circle-exclamation"></i> ${errMsg}</div>`
            : short
                ? `<div class="buy-sheet-note err">Not enough Tokens. You need ${(-after).toLocaleString()} more.</div>`
                : `<div class="buy-sheet-note">Cookies are added to your wallet instantly.</div>`;
        sheet.innerHTML = `
            <div class="buy-sheet-handle"></div>
            <div class="buy-sheet-title" id="buy-sheet-title">Confirm Purchase</div>
            <div class="buy-sheet-item">
                <img src="${p.img}" alt="">
                <div>
                    <div class="buy-sheet-item-name">${p.cookies.toLocaleString()} Cookies</div>
                    <div class="buy-sheet-item-sub">1 Token = 10 Cookies</div>
                </div>
            </div>
            <div class="buy-sheet-rows">
                <div class="buy-sheet-row"><span>Price</span><b><i class="fas fa-coins"></i> ${p.tokens.toLocaleString()} Tokens</b></div>
                <div class="buy-sheet-row"><span>Your Balance</span><b>${bal.toLocaleString()} Tokens</b></div>
                <div class="buy-sheet-row"><span>Balance After</span><b class="${short ? 'neg' : ''}">${short ? '—' : after.toLocaleString() + ' Tokens'}</b></div>
            </div>
            ${note}
            <div class="buy-sheet-actions">
                <button type="button" class="buy-cancel" onclick="closeSheet()" ${buying ? 'disabled' : ''}>Cancel</button>
                <button type="button" class="buy-ok" id="buy-ok" onclick="confirmBuy()" ${short || buying ? 'disabled' : ''}>${buying ? '<i class="fa-solid fa-spinner fa-spin"></i>' : 'Buy Now'}</button>
            </div>`;
    }

    function renderDone(p) {
        document.getElementById('buy-sheet').innerHTML = `
            <div class="buy-sheet-handle"></div>
            <div class="buy-done">
                <div class="buy-done-icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="buy-done-title" id="buy-sheet-title">Purchase Complete</div>
                <div class="buy-done-sub">${p.cookies.toLocaleString()} Cookies have been added to your wallet.</div>
            </div>
            <div class="buy-sheet-actions">
                <button type="button" class="buy-ok" onclick="closeSheet()">Done</button>
            </div>`;
    }

    function openSheet() {
        renderSheet();
        document.getElementById('buy-overlay').classList.add('show');
        document.getElementById('buy-sheet').classList.add('show');
    }

    function closeSheet() {
        if (buying) return;
        selected = null;
        document.getElementById('buy-overlay').classList.remove('show');
        document.getElementById('buy-sheet').classList.remove('show');
        renderPacks();
    }

    function selectPack(i) {
        if (buying) return;
        selected = i;
        renderPacks();
        openSheet();
    }

    // ซื้อทันที: Token ถูกหัก คุกกี้เข้ากระเป๋าเลย (ไม่ผ่านตะกร้า/Redeem)
    async function confirmBuy() {
        const p = COOKIE_PACKS[selected];
        if (!p || buying) return;
        buying = true;
        renderSheet();
        try {
            const res = await blm48ExchangeCookies(user.username, p.tokens);
            if (!res || res.status !== 'success') throw new Error('fail');
            user.token = res.newToken;
            user.cookie = res.newCookie;
            saveUserSession(user);
            renderBalance();
            buying = false;
            renderDone(p);
        } catch (e) {
            console.error('Buy cookies error:', e);
            buying = false;
            renderSheet('Purchase failed. Please try again.');
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

    async function refreshBalance() {
        try {
            const wallet = await blm48GetWallet(user.username);
            if (wallet && wallet.token !== undefined) {
                user.token = wallet.token;
                user.cookie = wallet.cookie;
                user.geToken = wallet.geToken;
                user.fanCookies = wallet.fanCookies;
                saveUserSession(user);
                renderBalance();
            }
        } catch (e) { console.error('refreshBalance error:', e); }
    }

    window.addEventListener('DOMContentLoaded', () => {
        user = getUserSession();
        if (!user) { window.location.href = 'login'; return; }
        renderPacks();
        renderBalance();
        refreshBalance();
    });
</script>
</body>
</html>
