<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <script src="assets/js/back-nav.js"></script>
    <title>BLM48 Membership | Collection Book</title>
    <meta name="referrer" content="no-referrer"><!-- รูปปก/การ์ดเดิมอยู่บน lh3.googleusercontent.com ซึ่งปฏิเสธบาง referrer -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <style>
        :root {
            --pink: #ff85a2; --ink: #222; --muted: #666666; --line: #efefef;
            --blm: #ff85a2; --npt: #66cbff; --gold: #e0b953;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Quicksand', 'Google Sans', sans-serif; background: #fff; color: var(--ink); min-height: 100vh; }

        .top-navigation-bar {
            position: sticky; top: 0; z-index: 100;
            height: 56px; display: flex; align-items: center; justify-content: center;
            background: #fff; border-bottom: 1px solid #e8e8e8;
            padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
        }
        .nav-back-btn {
            position: absolute; left: 6px; bottom: 6px; width: 44px; height: 44px;
            background: none; border: none; color: #222; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .top-bar-page-title { font-size: 18px; font-weight: 600; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }

        /* สรุปความคืบหน้าทั้งเล่ม */
        .cb-hero {
            margin-top: 16px; padding: 18px 18px 16px; border-radius: 18px;
            background: #fafafa; display: flex; align-items: center; gap: 16px;
        }
        .cb-ring { position: relative; width: 78px; height: 78px; flex-shrink: 0; }
        .cb-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .cb-ring .track { stroke: #ececec; }
        .cb-ring .bar { stroke: var(--group-color, var(--blm)); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
        .cb-ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .cb-hero-body { flex: 1; min-width: 0; }
        .cb-hero-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
        .cb-hero-num { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
        .cb-hero-num small { font-size: 15px; color: var(--muted); font-weight: 600; }
        .cb-hero-sub { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
        .cb-hero-sub i { color: var(--gold); margin-right: 4px; }

        /* แท็บวง BLM48 / NPT48 */
        .group-tabs { display: flex; margin-top: 16px; border-bottom: 1px solid #ececec; }
        .group-tab {
            flex: 1; background: none; border: none; cursor: pointer; position: relative;
            padding: 10px 0 12px; font-family: inherit; font-size: 15px; font-weight: 600; color: #707070;
        }
        .group-tab::after {
            content: ''; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 3px;
            border-radius: 3px 3px 0 0; background: var(--group-color); transform: scaleX(0); transition: transform .2s ease;
        }
        .group-tab.active { color: #222; font-weight: 700; }
        .group-tab.active::after { transform: scaleX(1); }

        .cb-sort { display: flex; gap: 8px; padding: 14px 0 2px; overflow-x: auto; scrollbar-width: none; }
        .cb-sort::-webkit-scrollbar { display: none; }
        .cb-chip {
            flex-shrink: 0; border: 1px solid #e3e3e3; background: #fff; border-radius: 999px; padding: 7px 14px;
            font-family: inherit; font-size: 13.5px; font-weight: 600; color: #444; cursor: pointer;
        }
        .cb-chip.active { background: #222; border-color: #222; color: #fff; }

        /* ชุดสะสม: แบบปกสมุด */
        .set-list { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
        @media (min-width: 640px) { .set-list { grid-template-columns: 1fr 1fr; } }
        .set-card {
            display: flex; gap: 14px; align-items: stretch; padding: 12px; border-radius: 16px;
            border: 1px solid var(--line); background: #fff; text-decoration: none; color: inherit;
            -webkit-tap-highlight-color: transparent; transition: transform .15s;
        }
        .set-card:active { transform: scale(0.98); }
        .set-cover {
            width: 76px; height: 76px; flex-shrink: 0; border-radius: 12px; overflow: hidden;
            background: #f4f4f6; display: flex; align-items: center; justify-content: center;
        }
        .set-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .set-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
        .set-name {
            font-size: 14.5px; font-weight: 700; line-height: 1.3;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .set-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .set-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 8px; background: #f2f2f5; color: #666; }
        .set-tag.is-open { background: #e9f8ef; color: #2f9e5b; }
        .set-tag.is-done { background: #fbf3dc; color: #a07a1c; }
        .set-progress { display: flex; align-items: center; gap: 10px; }
        .bar { flex: 1; height: 7px; border-radius: 99px; background: #efefef; overflow: hidden; }
        .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--group-color); }
        .set-card.is-done .bar > span { background: var(--gold); }
        .set-count { font-size: 12.5px; font-weight: 700; color: #444; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .set-count small { color: var(--muted); font-weight: 600; }
        .set-chev { align-self: center; color: #bbb; font-size: 13px; }

        .state-box { text-align: center; color: #707070; font-size: 13.5px; padding: 56px 20px; }
        .state-box i { font-size: 30px; color: #d5d5d5; display: block; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="top-navigation-bar">
        <button type="button" class="nav-back-btn" onclick="blm48Back('inventory')" aria-label="Back">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="top-bar-page-title">Collection Book</div>
    </div>

    <div class="wrap" id="page">
        <div class="cb-hero">
            <div class="cb-ring">
                <svg viewBox="0 0 80 80" aria-hidden="true">
                    <circle class="track" cx="40" cy="40" r="34" fill="none" stroke-width="8"/>
                    <circle class="bar" id="ring-bar" cx="40" cy="40" r="34" fill="none" stroke-width="8" stroke-dasharray="213.6" stroke-dashoffset="213.6"/>
                </svg>
                <div class="cb-ring-text" id="ring-text">0%</div>
            </div>
            <div class="cb-hero-body">
                <div class="cb-hero-label" id="hero-label">Collected</div>
                <div class="cb-hero-num" id="hero-num">0 <small>/ 0</small></div>
                <div class="cb-hero-sub" id="hero-sub"></div>
            </div>
        </div>

        <div class="group-tabs" id="group-tabs" role="tablist" aria-label="Group"></div>

        <div class="cb-sort" id="sort-chips"></div>

        <div id="set-list" class="set-list">
            <div class="state-box" style="grid-column:1/-1"><i class="fa-solid fa-spinner fa-spin"></i>Loading Collection Book...</div>
        </div>
    </div>

<script>
    const GROUPS = [
        { key: 'BLM48', color: '#ff85a2' },
        { key: 'NPT48', color: '#66cbff' }
    ];
    const SORTS = [
        { key: 'new', label: 'Latest' },
        { key: 'progress', label: 'Almost Done' },
        { key: 'missing', label: 'Incomplete' },
        { key: 'done', label: 'Complete' }
    ];
    let album = [];
    let currentGroup = readPref('blm48_cb_group', 'BLM48');
    let currentSort = 'new';

    function readPref(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
    function writePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    function groupColor(g) { return (GROUPS.find(x => x.key === g) || GROUPS[0]).color; }
    function inGroup(s, g) { return s.group === g || s.group === 'Both'; } // Both = ขึ้นทั้งสองวง
    function setsOfGroup() { return album.filter(s => inGroup(s, currentGroup)); }
    function pct(o, t) { return t ? Math.floor(o * 100 / t) : 0; }

    function renderTabs() {
        document.getElementById('group-tabs').innerHTML = GROUPS.map(g =>
            `<button type="button" role="tab" class="group-tab${g.key === currentGroup ? ' active' : ''}" style="--group-color:${g.color}" onclick="selectGroup('${g.key}')">${g.key}</button>`
        ).join('');
        document.getElementById('sort-chips').innerHTML = SORTS.map(s =>
            `<button type="button" class="cb-chip${s.key === currentSort ? ' active' : ''}" onclick="selectSort('${s.key}')">${s.label}</button>`
        ).join('');
    }

    function selectGroup(g) { currentGroup = g; writePref('blm48_cb_group', g); render(); }
    function selectSort(s) { currentSort = s; render(); }

    function renderHero() {
        const sets = setsOfGroup();
        const total = sets.reduce((a, s) => a + s.total, 0);
        const owned = sets.reduce((a, s) => a + s.owned, 0);
        const done = sets.filter(s => s.total && s.owned >= s.total).length;
        const p = pct(owned, total);
        const color = groupColor(currentGroup);
        document.querySelector('.cb-hero').style.setProperty('--group-color', color);
        document.getElementById('ring-bar').style.strokeDashoffset = (213.6 * (1 - (total ? owned / total : 0))).toFixed(1);
        document.getElementById('ring-text').textContent = p + '%';
        document.getElementById('hero-label').textContent = currentGroup + ' Collected';
        document.getElementById('hero-num').innerHTML = `${owned.toLocaleString()} <small>/ ${total.toLocaleString()} items</small>`;
        document.getElementById('hero-sub').innerHTML = `<i class="fa-solid fa-crown"></i>${done} of ${sets.length} sets complete`;
    }

    function renderList() {
        const list = document.getElementById('set-list');
        let sets = setsOfGroup().slice();
        if (currentSort === 'progress') sets = sets.filter(s => s.owned < s.total).sort((a, b) => (b.owned / b.total) - (a.owned / a.total));
        if (currentSort === 'missing') sets = sets.filter(s => s.owned < s.total);
        if (currentSort === 'done') sets = sets.filter(s => s.total && s.owned >= s.total);

        if (!sets.length) {
            const msg = currentSort === 'done' ? 'No complete sets yet'
                : currentSort === 'new' ? `No ${currentGroup} sets yet` : 'All sets complete';
            list.innerHTML = `<div class="state-box" style="grid-column:1/-1"><i class="fa-solid fa-book-open"></i>${msg}</div>`;
            return;
        }

        const color = groupColor(currentGroup);
        list.innerHTML = sets.map(s => {
            const done = s.total && s.owned >= s.total;
            const p = pct(s.owned, s.total);
            return `
            <a class="set-card${done ? ' is-done' : ''}" style="--group-color:${color}" href="collection_set?id=${encodeURIComponent(s.key)}">
                <div class="set-cover">${s.cover
                    ? `<img src="${escapeAttr(s.cover)}" alt="" loading="lazy" onerror="this.remove()">`
                    : '<i class="fa-solid fa-layer-group" style="color:#ccc;font-size:22px"></i>'}</div>
                <div class="set-body">
                    <div class="set-name">${escapeHtml(s.name)}</div>
                    <div class="set-tags">
                        <span class="set-tag">${escapeHtml(categoryLabel(s.category))}</span>
                        ${s.isOpen ? '<span class="set-tag is-open">On Sale</span>' : ''}
                        ${done ? '<span class="set-tag is-done"><i class="fa-solid fa-crown"></i> Complete</span>' : ''}
                    </div>
                    <div class="set-progress">
                        <div class="bar"><span style="width:${p}%"></span></div>
                        <span class="set-count">${s.owned}<small>/${s.total}</small></span>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right set-chev"></i>
            </a>`;
        }).join('');
    }

    function categoryLabel(cat) {
        return String(cat || '').replace(/^(BLM48|NPT48)\s+/, '') || 'Collection';
    }

    function render() { renderTabs(); renderHero(); renderList(); }

    window.onload = async () => {
        const user = getUserSession();
        if (!user) { window.location.href = 'login'; return; }
        try {
            const data = await blm48GetCollectionAlbum(user.username);
            album = Array.isArray(data) ? data : [];
            // ถ้าวงที่จำไว้ไม่มีชุดเลย แต่อีกวงมี ให้เปิดวงที่มี
            if (!album.some(s => inGroup(s, currentGroup)) && album.length) currentGroup = album[0].group === 'NPT48' ? 'NPT48' : 'BLM48';
            render();
        } catch (err) {
            console.error(err);
            document.getElementById('set-list').innerHTML =
                '<div class="state-box" style="grid-column:1/-1"><i class="fa-solid fa-triangle-exclamation"></i>Could not load Collection Book. Please try again.</div>';
        }
    };
</script>
</body>
</html>
