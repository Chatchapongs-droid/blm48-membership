<!DOCTYPE html>
<html lang="th">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <script src="assets/js/back-nav.js"></script>
    <title>BLM48 Membership | Collection</title>
    <meta name="referrer" content="no-referrer"><!-- รูปปก/การ์ดเดิมอยู่บน lh3.googleusercontent.com ซึ่งปฏิเสธบาง referrer -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s32">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p6lV8bD6VVjR-Ys2EnpcQH1AOsnahQSp=s180">
    <meta name="apple-mobile-web-app-title" content="BLM48">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/item-3d-viewer.js"></script>
    <style>
        :root { --ink: #222; --muted: #666; --line: #efefef; --gold: #e0b953; --group-color: #ff85a2; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Quicksand', 'Kanit', sans-serif; background: #fff; color: var(--ink); min-height: 100vh; }

        .top-navigation-bar {
            position: sticky; top: 0; z-index: 100;
            height: 56px; display: flex; align-items: center; justify-content: center;
            background: #fff; border-bottom: 1px solid #e8e8e8;
            padding-top: env(safe-area-inset-top, 0px); box-sizing: content-box;
        }
        .nav-back-btn {
            position: absolute; left: 6px; bottom: 6px; width: 44px; height: 44px;
            background: none; border: none; color: #222; font-size: 22px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .top-bar-page-title { font-size: 18px; font-weight: 600; }

        .wrap { max-width: 900px; margin: 0 auto; padding: 0 12px 48px; }

        /* หัวชุด: ปก + ชื่อ + ความคืบหน้า */
        .set-head { display: flex; gap: 14px; align-items: center; padding: 18px 0 16px; border-bottom: 1px solid var(--line); }
        .set-head-cover {
            width: 84px; height: 84px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #f4f4f6;
            display: flex; align-items: center; justify-content: center;
        }
        .set-head-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .set-head-body { flex: 1; min-width: 0; }
        .set-head-cat { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
        .set-head-name { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 2px 0 10px; }
        .set-head-progress { display: flex; align-items: center; gap: 10px; }
        .bar { flex: 1; height: 8px; border-radius: 99px; background: #efefef; overflow: hidden; }
        .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--group-color); transition: width .6s ease; }
        .is-done .bar > span { background: var(--gold); }
        .set-head-count { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .set-head-count small { color: var(--muted); font-weight: 600; }
        .done-banner {
            margin-top: 12px; display: none; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px;
            background: #fbf3dc; color: #8a6510; font-size: 13px; font-weight: 600;
        }
        .is-done .done-banner { display: flex; }

        .filter-row { display: flex; gap: 8px; padding: 14px 0 4px; overflow-x: auto; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        .chip {
            flex-shrink: 0; border: 1px solid #e3e3e3; background: #fff; border-radius: 999px; padding: 7px 14px;
            font-family: inherit; font-size: 13.5px; font-weight: 600; color: #444; cursor: pointer;
        }
        .chip span { color: var(--muted); font-weight: 600; margin-left: 2px; }
        .chip.active { background: #222; border-color: #222; color: #fff; }
        .chip.active span { color: #ddd; }

        /* 📚 หน้าสมุด: ช่องการ์ดเรียงตามเลข */
        .binder { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; margin-top: 14px; }
        @media (min-width: 520px) { .binder { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 760px) { .binder { grid-template-columns: repeat(5, 1fr); gap: 18px 14px; } }

        .slot { min-width: 0; -webkit-tap-highlight-color: transparent; }
        .slot-frame {
            position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .slot.is-owned { cursor: pointer; }
        .slot.is-owned .slot-frame { background: #f6f6f8; border: 1.5px solid #ececec; transition: transform .15s; }
        .slot.is-owned:active .slot-frame { transform: scale(0.96); }
        .slot.is-owned img { width: 100%; height: 100%; object-fit: contain; padding: 6px; display: block; }
        .slot.is-ssr .slot-frame {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px rgba(224,185,83,.45), 0 4px 12px rgba(224,185,83,.25);
        }
        .slot.is-ssr .slot-frame::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%);
            background-size: 250% 100%; animation: shine 3.2s ease-in-out infinite;
        }
        @keyframes shine { 0% { background-position: 130% 0; } 60%, 100% { background-position: -30% 0; } }
        @media (prefers-reduced-motion: reduce) { .slot.is-ssr .slot-frame::after { animation: none; } }

        /* ยังไม่มี: โชว์รูปสินค้าแบบเทาดำ (ฟิลเตอร์ขาวดำ + มืดลง) */
        .slot.is-missing .slot-frame { background: #ececef; border: 1.5px solid #e2e2e6; }
        .slot.is-missing img {
            width: 100%; height: 100%; object-fit: contain; padding: 6px; display: block;
            filter: grayscale(1) brightness(0.55) contrast(0.9); opacity: 0.85;
        }
        .slot-missing-no { font-size: 20px; font-weight: 700; color: #b9b9c2; font-variant-numeric: tabular-nums; }

        .slot-no {
            position: absolute; left: 6px; top: 6px; z-index: 2; font-size: 10.5px; font-weight: 700;
            padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.9); color: #555; font-variant-numeric: tabular-nums;
        }
        .slot-qty {
            position: absolute; right: 6px; bottom: 6px; z-index: 2;
            background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
        }
        .slot-name {
            margin-top: 6px; font-size: 12px; font-weight: 500; color: #333; min-height: 16px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .slot.is-missing .slot-name { color: #9a9aa3; }

        .state-box { grid-column: 1 / -1; text-align: center; color: #707070; font-size: 13.5px; padding: 56px 20px; }
        .state-box i { font-size: 30px; color: #d5d5d5; display: block; margin-bottom: 12px; }

        .get-more {
            display: flex; align-items: center; justify-content: center; gap: 8px; margin: 26px auto 0; max-width: 360px;
            padding: 13px 18px; border-radius: 14px; background: #222; color: #fff; text-decoration: none;
            font-size: 14px; font-weight: 600;
        }
        .get-more:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="top-navigation-bar">
        <button type="button" class="nav-back-btn" onclick="blm48Back('collection_book')" aria-label="Back">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="top-bar-page-title">Collection</div>
    </div>

    <div class="wrap">
        <div id="set-head" class="set-head" style="display:none">
            <div class="set-head-cover" id="head-cover"></div>
            <div class="set-head-body">
                <div class="set-head-cat" id="head-cat"></div>
                <div class="set-head-name" id="head-name"></div>
                <div class="set-head-progress">
                    <div class="bar"><span id="head-bar" style="width:0"></span></div>
                    <span class="set-head-count" id="head-count"></span>
                </div>
                <div class="done-banner"><i class="fa-solid fa-crown"></i>Set complete</div>
            </div>
        </div>

        <div class="filter-row" id="filter-row"></div>

        <div class="binder" id="binder">
            <div class="state-box"><i class="fa-solid fa-spinner fa-spin"></i>Loading collection...</div>
        </div>

        <a id="get-more" class="get-more" href="shop" style="display:none"><i class="fa-solid fa-bag-shopping"></i>Collect more in Shop</a>
    </div>

<script>
    const GROUP_COLOR = { BLM48: '#ff85a2', NPT48: '#66cbff' };
    let set = null;
    let currentFilter = 'all';

    function pad(n, total) { return String(n).padStart(String(total).length < 3 ? 3 : String(total).length, '0'); }

    function renderHead() {
        const head = document.getElementById('set-head');
        head.style.display = '';
        head.style.setProperty('--group-color', GROUP_COLOR[set.group] || GROUP_COLOR.BLM48);
        const done = set.total && set.owned >= set.total;
        head.classList.toggle('is-done', !!done);
        document.getElementById('head-cover').innerHTML = set.cover
            ? `<img src="${escapeAttr(set.cover)}" alt="" onerror="this.remove()">`
            : '<i class="fa-solid fa-layer-group" style="color:#ccc;font-size:24px"></i>';
        document.getElementById('head-cat').textContent = ((set.group === 'Both' ? 'BLM48 + NPT48' : set.group) + ' · ' + String(set.category || '').replace(/^(BLM48|NPT48)\s+/, '')).toUpperCase();
        document.getElementById('head-name').textContent = set.name;
        document.getElementById('head-bar').style.width = (set.total ? Math.floor(set.owned * 100 / set.total) : 0) + '%';
        document.getElementById('head-count').innerHTML = `${set.owned}<small>/${set.total}</small>`;
        document.title = 'BLM48 Membership | ' + set.name;
        // ชุดที่ยังเปิดขายและยังไม่ครบ: มีปุ่มไปสะสมเพิ่ม 
        document.getElementById('get-more').style.display = set.isOpen && !done ? '' : 'none';
    }

    function renderFilters() {
        const missing = set.total - set.owned;
        const opts = [['all', 'All', set.total], ['owned', 'Owned', set.owned], ['missing', 'Missing', missing]];
        document.getElementById('filter-row').innerHTML = opts.map(([k, label, n]) =>
            `<button type="button" class="chip${k === currentFilter ? ' active' : ''}" onclick="selectFilter('${k}')">${label} <span>${n}</span></button>`
        ).join('');
    }

    function selectFilter(k) { currentFilter = k; renderFilters(); renderBinder(); }

    function renderBinder() {
        const binder = document.getElementById('binder');
        const cards = set.cards.filter(c => currentFilter === 'all' || (currentFilter === 'owned' ? c.owned : !c.owned));
        if (!cards.length) {
            binder.innerHTML = currentFilter === 'owned'
                ? '<div class="state-box"><i class="fa-regular fa-square"></i>No items owned in this set yet</div>'
                : '<div class="state-box"><i class="fa-solid fa-crown"></i>Nothing missing. Set complete!</div>';
            return;
        }
        binder.innerHTML = cards.map(c => {
            const no = pad(c.no, set.total);
            if (!c.owned) {
                return `<div class="slot is-missing" aria-label="No. ${no} not owned">
                    <div class="slot-frame">${c.img
                        ? `<span class="slot-no">${no}</span><img src="${escapeAttr(c.img)}" alt="" loading="lazy" onerror="this.remove()">`
                        : `<span class="slot-missing-no">${no}</span>`}</div>
                    <div class="slot-name">???</div>
                </div>`;
            }
            return `<div class="slot is-owned${c.ssr ? ' is-ssr' : ''}" role="button" tabindex="0" onclick="openCard(${c.no})" onkeydown="if(event.key==='Enter')openCard(${c.no})">
                <div class="slot-frame">
                    <span class="slot-no">${no}</span>
                    <img src="${escapeAttr(c.img || '')}" alt="${escapeAttr(c.name || '')}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/120x160/f6f6f8/ff85a2?text=BLM48'">
                    ${c.qty > 1 ? `<span class="slot-qty">x${c.qty}</span>` : ''}
                </div>
                <div class="slot-name" title="${escapeAttr(c.name || '')}">${escapeHtml(c.name || '')}</div>
            </div>`;
        }).join('');
    }

    // 🔍 แตะการ์ดที่มีแล้ว = หมุนดู 3D (ตัวดูเดียวกับหน้า Inventory)
    function openCard(no) {
        const c = set.cards.find(x => x.no === no);
        if (!c || !c.owned || !window.blm48Open3DViewer) return;
        blm48Open3DViewer({ image: c.img, label: c.name, isSSR: !!c.ssr, collection: set.name, collectionId: c.collectionId,
            back: c.backImg || '', studio: true });
    }

    window.onload = async () => {
        const user = getUserSession();
        if (!user) { window.location.href = 'login'; return; }
        const id = new URLSearchParams(location.search).get('id') || '';
        try {
            const album = await blm48GetCollectionAlbum(user.username);
            set = (Array.isArray(album) ? album : []).find(s => s.key === id);
            if (!set) {
                document.getElementById('binder').innerHTML = '<div class="state-box"><i class="fa-solid fa-book-open"></i>Collection not found</div>';
                return;
            }
            renderHead();
            renderFilters();
            renderBinder();
        } catch (err) {
            console.error(err);
            document.getElementById('binder').innerHTML = '<div class="state-box"><i class="fa-solid fa-triangle-exclamation"></i>Could not load this collection. Please try again.</div>';
        }
    };
</script>
</body>
</html>
