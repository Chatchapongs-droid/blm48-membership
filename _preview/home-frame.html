<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home frame</title></head>
<body style="margin:0">
<!-- Preview harness: loads the real Home with scripts disabled (no login redirect), then fills sample content. -->
<iframe id="f" sandbox="allow-same-origin" src="../index.html" style="border:0;width:100vw;height:100vh"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument;
  ['splash-screen', 'app-loading-screen'].forEach(function (id) { var e = d.getElementById(id); if (e) e.style.display = 'none'; });
  d.getElementById('home-champ-name').textContent = 'Mewnich';
  d.getElementById('weekly-tracker-grid').innerHTML = '<div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:700">' + ['17','18','19','20','21','22','23'].map(function (x) { return '<div>' + x + '</div>'; }).join('') + '</div>';
  d.getElementById('ranking-list').innerHTML = ['P','M','F','J'].map(function (x) { return '<div style="flex:0 0 64px;height:64px;border-radius:50%;background:#ffb3c6;margin:0 8px;display:grid;place-items:center;color:#fff;font-weight:700">' + x + '</div>'; }).join('');
  d.getElementById('campaign-scroller').innerHTML = [1,2].map(function () { return '<a class="campaign-card"><div style="aspect-ratio:2048/1427;border-radius:12px;background:linear-gradient(160deg,#e5dcff,#b7a2ff)"></div><div style="padding:8px 4px">Campaign</div></a>'; }).join('');
  d.getElementById('posts-container').innerHTML = [1,2].map(function (i) { return '<div class="post-card"><div class="post-header"><b>Pim</b></div><div class="post-body">Sample post ' + i + '</div><div style="aspect-ratio:4/5;border-radius:12px;background:linear-gradient(160deg,#ffd6e0,#ff9fb8)"></div></div>'; }).join('');
});
</script>
</body></html>
