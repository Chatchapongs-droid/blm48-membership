    <div id="access-denied"><i class="fa-solid fa-lock"></i><br>This page is for Admin accounts only</div>
    <div id="page-content">
        <div id="root"><div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div></div>
    </div>
</div>
<input type="file" id="file-one" accept="image/*" style="display:none;">
<input type="file" id="file-many" accept="image/*" multiple style="display:none;">
<div class="save-bar" id="save-bar"></div>

<script>
  const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
  const STATES = { open: 'On sale', scheduled: 'Scheduled', soldout: 'Sold out', off: 'Off sale', draft: 'Draft', ended: 'Ended' };
  const TABS = [['info', 'Info'], ['sale', 'Sale'], ['cards', 'Cards'], ['stock', 'Stock'], ['preorder', 'Pre-order']];
  const BONUS_FIELDS = [['bonusToken', 'Token', 'fa-coins'], ['bonusGeToken', 'GE Token', 'fa-gem'], ['bonusCookie', 'Cookie', 'fa-cookie-bite']];
  const params = new URLSearchParams(location.search);
  let collectionId = params.get('id');
  let user = null;
  let saved = null;   // ข้อมูลล่าสุดจากเซิร์ฟเวอร์
  let draft = null;   // ค่าที่กำลังแก้ { ...collection, items: [{ key, id, name, imageUrl, pct, tag, stock, sold, add }] }
  // วงของสินค้า (เก็บใน collections.group_name) + หมวดสินค้าแบบไม่มีชื่อวง
  const GROUPS = [['BLM48', 'BLM48'], ['NPT48', 'NPT48'], ['Both', 'Both groups']];
  let categoryTypes = ['Coaster', 'PhotoCard', 'Badge', 'PhotoSet', 'Photobook', 'Poster'];
  function splitCategory(cat) { return String(cat || '').replace(/^(BLM48|NPT48)\s+/i, '').trim() || 'Coaster'; }
  function groupOf(c) {
    if (['BLM48', 'NPT48', 'Both'].includes(c.group)) return c.group;
    return /^NPT48/i.test(String(c.category || '')) ? 'NPT48' : 'BLM48';
  }
  // ค่าที่เก็บใน collections.category (Inventory/Collection Book ยังอ่านชื่อวงนำหน้าได้เหมือนเดิม)
  function composeCategory(group, type) {
    if (group === 'NPT48') return 'NPT48 ' + type;
    if (group === 'Both') return type;
    return type === 'Coaster' ? 'Coaster' : 'BLM48 ' + type;
  }
  function typeOptions() {
    const list = [...categoryTypes];
    if (draft.type && !list.includes(draft.type)) list.push(draft.type);
    return [...new Set(list)];
  }
  let tab = TABS.some(([k]) => k === params.get('tab')) ? params.get('tab') : 'info';
  let changed = false;
  let saving = false;
  let uploadTarget = null; // 'cover' | key ของการ์ด
  let keySeq = 0;

  function fmt(n) { return Number(n || 0).toLocaleString(); }
  function fmtDate(s) {
    return s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  }
  // ISO <-> ช่อง datetime-local (เวลาเครื่อง)
  function toLocalInput(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fromLocalInput(v) { return v ? new Date(v).toISOString() : null; }
  // อัตราออกเก็บเป็นสัดส่วน (0.05) -> หน้าเว็บแสดงเป็น % (5)
  function rateToPct(r) { return Math.round(Number(r || 0) * 100 * 10000) / 10000; }
  function round4(n) { return Math.round(n * 10000) / 10000; }

  function listUrl() { return 'admin_collections'; }
  function goBack() {
    if (isDirty()) { leaving = true; renderSaveBar(); return; }
    leaveNow();
  }
  // actionLabel/onAction = ปุ่มในตัว toast เช่น "เอากลับ" (อยู่นานขึ้นให้กดทัน)
  function toast(msg, actionLabel, onAction) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    if (actionLabel) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-act'; b.textContent = actionLabel;
      b.onclick = () => { t.style.display = 'none'; onAction(); };
      t.appendChild(b);
    }
    t.style.display = 'flex';
    clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, actionLabel ? 5000 : 2400);
  }

  function emptyCollection() {
    return { collectionId: null, name: '', description: '', coverImage: '', backImage: '', backStyle: 'card', category: 'Coaster', on: false, state: 'off',
      costTokens: 10, costTokensX5: 45, allowX5: true, cardsPerDraw: 1, maxDrawsPerAccount: null, saleStartAt: null, saleEndAt: null,
      isLucky: false, sold: 0, items: [], logs: [], preorder: null };
  }
  function toPreorderDraft(p) {
    p = p || {};
    return { on: !!p.on, bonusToken: p.bonusToken ? String(p.bonusToken) : '', bonusGeToken: p.bonusGeToken ? String(p.bonusGeToken) : '',
      bonusCookie: p.bonusCookie ? String(p.bonusCookie) : '', timing: p.timing === 'purchase' ? 'purchase' : 'ship', deliveryInfo: p.deliveryInfo || '', limitStock: p.limitStock !== false };
  }

  function toDraft(c) {
    return {
      name: c.name || '', description: c.description || '', coverImage: c.coverImage || '', group: groupOf(c), type: splitCategory(c.category),
      backImage: c.backImage || '', backStyle: c.backStyle === 'shape' ? 'shape' : 'card',
      on: !!c.on, costTokens: c.costTokens ?? '', costTokensX5: c.costTokensX5 ?? '', allowX5: c.allowX5 !== false,
      cardsPerDraw: c.cardsPerDraw ?? 1, maxDrawsPerAccount: c.maxDrawsPerAccount ?? '', saleStartAt: toLocalInput(c.saleStartAt), saleEndAt: toLocalInput(c.saleEndAt),
      preorder: toPreorderDraft(c.preorder),
      items: (c.items || []).map(i => ({ key: 'k' + (++keySeq), id: i.id, name: i.name || '', imageUrl: i.imageUrl || '',
        pct: rateToPct(i.rate), tag: i.tag === 'SSR' ? 'SSR' : null, stock: Number(i.stock || 0), sold: Number(i.sold || 0), add: '' }))
    };
  }

  async function load() {
    if (!collectionId) {
      saved = emptyCollection();
      draft = toDraft(saved);
      render();
      return;
    }
    const root = document.getElementById('root');
    try {
      const res = await blm48AdminGetCollection(user.username, collectionId);
      if (!res || res.status !== 'success') { root.innerHTML = `<div class="empty-state">${escapeHtml((res && res.message) || 'Could not load data')}</div>`; return; }
      saved = res.data;
      if (Array.isArray(res.categories)) categoryTypes = [...new Set([...categoryTypes, ...res.categories.filter(Boolean).map(splitCategory)])];
      draft = toDraft(saved);
      render();
    } catch (e) {
      root.innerHTML = '<div class="empty-state">Cannot connect to the server</div>';
    }
  }

  // ===== เปลี่ยนแปลงที่ยังไม่บันทึก =====
  function snapshot(d) {
    // ตัวเลขเทียบเป็นข้อความ (ช่อง input คืนค่าเป็นสตริง)
    return JSON.stringify({ ...d, items: d.items.map(i => ({ id: i.id, name: i.name.trim(), imageUrl: i.imageUrl, pct: Number(i.pct) || 0, tag: i.tag, add: Number(i.add) || 0 })) },
      (k, v) => typeof v === 'number' && k !== 'id' ? String(v) : v);
  }
  function isDirty() { return !!draft && !!saved && (!saved.collectionId || snapshot(draft) !== snapshot(toDraft(saved))); }

  function totals() {
    const items = draft.items;
    const pct = round4(items.reduce((s, i) => s + (Number(i.pct) || 0), 0));
    const ssrPct = round4(items.filter(i => i.tag === 'SSR').reduce((s, i) => s + (Number(i.pct) || 0), 0));
    const stock = items.reduce((s, i) => s + Math.max(i.stock + (Number(i.add) || 0), 0), 0);
    return { pct, ssrPct, stock, ssr: items.filter(i => i.tag === 'SSR').length };
  }

  // ตรวจก่อนบันทึก -> { msg, tab } ข้อแรกที่ผิด (ตรงกับที่เซิร์ฟเวอร์ตรวจ) / tab = แท็บที่ต้องไปแก้
  function validate() {
    const e = (msg, tab) => ({ msg, tab });
    if (!draft.name.trim()) return e('Please enter a collection name', 'info');
    const cost = Number(draft.costTokens);
    if (draft.costTokens === '' || !Number.isInteger(cost) || cost < 0) return e('x1 price must be a whole number', 'sale');
    if (draft.allowX5) {
      const c5 = Number(draft.costTokensX5);
      if (draft.costTokensX5 === '' || !Number.isInteger(c5) || c5 < 0) return e('x5 price must be a whole number', 'sale');
    }
    if (!(Number.isInteger(Number(draft.cardsPerDraw)) && Number(draft.cardsPerDraw) >= 1 && Number(draft.cardsPerDraw) <= 10)) return e('Cards per draw must be 1 to 10', 'sale');
    if (draft.maxDrawsPerAccount !== '' &&!(Number.isInteger(Number(draft.maxDrawsPerAccount)) && Number(draft.maxDrawsPerAccount) >= 1)) return e('Limit per account must be 1 or more, or left empty', 'sale');
    if (draft.saleStartAt && draft.saleEndAt && new Date(draft.saleEndAt) <= new Date(draft.saleStartAt)) return e('Sale end must be after sale start', 'sale');
    if (!saved.isLucky) {
      for (const [k, label] of BONUS_FIELDS) {
        const v = draft.preorder[k];
        if (v !== '' && !(Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 1000000)) return e(`${label} bonus must be a whole number from 0 to 1,000,000`, 'preorder');
      }
      if (!draft.preorder.on && saved.preorder && saved.preorder.on && saved.preorder.waitingLines > 0) return e('Some pre-orders are still waiting to ship. Ship them before turning pre-order off', 'preorder');
      const names = new Set();
      for (const i of draft.items) {
        if (!i.name.trim()) return e('Every card needs a name', 'cards');
        // pre-order: cards may be added without images; images are only needed before Ship (the draw happens then)
        if (!i.imageUrl && !draft.preorder?.on) return e(`Card "${i.name}" has no image`, 'cards');
        if (!(Number(i.pct) >= 0)) return e(`Rate for "${i.name}" is not valid`, 'cards');
        if (i.add !== '' && !Number.isInteger(Number(i.add))) return e(`Remaining stock for "${i.name}" must be a whole number`, 'cards');
        const n = i.name.trim().toLowerCase();
        if (names.has(n)) return e(`Card name "${i.name}" is used twice`, 'cards');
        names.add(n);
      }
    }
    if (draft.on && !saved.isLucky) {
      if (!draft.coverImage) return e('Add a cover image before going on sale', 'info');
      if (!draft.items.length && !draft.preorder?.on) return e('Add at least 1 card before going on sale', 'cards');
      if (!draft.preorder?.on && !draft.items.some(i => i.stock + (Number(i.add) || 0) > 0 && Number(i.pct) > 0)) return e('Need at least one card with stock and a rate above 0 before going on sale', 'stock');
    }
    return null;
  }

  // เช็กลิสต์ "พร้อมเปิดขาย" (แสดงตอนยังไม่เปิด) แต่ละข้อกดแล้วไปแท็บนั้น
  function readiness() {
    const t = totals();
    return [
      { label: 'Name', ok: !!draft.name.trim(), tab: 'info' },
      { label: 'Cover', ok: !!draft.coverImage, tab: 'info' },
      { label: 'Price', ok: draft.costTokens !== '' && Number(draft.costTokens) >= 0, tab: 'sale' },
      { label: 'Cards', ok: draft.items.length > 0 && draft.items.every(i => i.name.trim() && i.imageUrl), tab: 'cards' },
      { label: 'Rates 100%', ok: draft.items.length > 0 && Math.abs(t.pct - 100) < 0.01, tab: 'cards' },
      { label: 'Stock', ok: t.stock > 0, tab: 'stock' }
    ];
  }

  // หัวหน้า: ปก + ชื่อ + สถานะ + เช็กลิสต์ (อัปเดตตามที่แก้ ไม่ต้องวาดทั้งหน้า)
  function renderHead() {
    const el = document.getElementById('col-head');
    if (!el) return;
    const t = totals();
    const isNew = !saved.collectionId;
    const state = isNew ? 'draft' : (saved.state === 'off' && !saved.sold ? 'draft' : saved.state);
    const cover = draft.coverImage ? `style="background-image:url('${escapeAttr(draft.coverImage)}')"` : '';
    const ready = !draft.on && !saved.isLucky ? readiness() : [];
    el.innerHTML = `
      <div class="ch-row">
        <div class="ch-cover ${draft.coverImage ? 'has' : ''}" ${cover}>${draft.coverImage ? '' : '<i class="fa-regular fa-image"></i>'}</div>
        <div class="ch-info">
          <div class="ch-name">${escapeHtml(draft.name.trim() || 'Untitled')}</div>
          <div class="ch-sub"><span class="pill ${state}">${STATES[state] || state}</span>${draft.preorder && draft.preorder.on ? '<span class="pill pre">Pre-order</span>' : ''}
            ${saved.isLucky ? 'Lucky Box' : `${fmt(draft.items.length)} cards · ${fmt(t.stock)} left${saved.sold ? ` · ${fmt(saved.sold)} sold` : ''}`}</div>
        </div>
      </div>
      ${ready.length ? `<div class="ready">
        <span class="ready-title">${ready.every(r => r.ok) ? '<i class="fa-solid fa-circle-check"></i> Ready to sell · turn on sale in the Sale tab' : 'Before going on sale'}</span>
        ${ready.every(r => r.ok) ? '' : ready.map(r => `<button type="button" class="ready-item ${r.ok ? 'ok' : ''}" onclick="setTab('${r.tab}')"><i class="fa-${r.ok ? 'solid fa-circle-check' : 'regular fa-circle'}"></i> ${r.label}</button>`).join('')}
      </div>` : ''}`;
  }

  // จุดแดงบนแท็บที่มีข้อผิดพลาด
  function refreshTabDots(err) {
    document.querySelectorAll('.tabs .filter-tab').forEach(b => b.classList.toggle('has-err', !!err && b.dataset.tab === err.tab));
  }

  let leaving = false; // กดย้อนกลับตอนยังไม่บันทึก -> ถามในแถบด้านล่าง (ไม่ใช้ popup)

  function renderSaveBar() {
    const bar = document.getElementById('save-bar');
    const show = isDirty();
    if (!show) leaving = false;
    bar.classList.toggle('show', show);
    document.getElementById('toast').classList.toggle('up', show);
    window.onbeforeunload = show ? () => true : null;
    renderHead();
    const err = show ? validate() : null;
    refreshTabDots(err);
    if (!show) { bar.innerHTML = ''; return; }
    if (saving) return;
    const isNew = !saved.collectionId;
    if (leaving) {
      bar.innerHTML = `<div class="save-bar-in">
          <div class="save-bar-txt"><b>Not saved</b> · Leave this page?</div>
          <button class="btn btn-del" onclick="leaveNow()">Leave without saving</button>
          <button class="btn btn-ghost" onclick="leaving = false; renderSaveBar();">Stay</button>
        </div>`;
      return;
    }
    bar.innerHTML = `<div class="save-bar-in">
        <div class="save-bar-txt">${err
          ? `<button type="button" class="err-link" onclick="setTab('${err.tab}')"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml(err.msg)} <i class="fa-solid fa-arrow-right"></i></button>`
          : (isNew ? `<b>New collection</b> · ${draft.on ? 'Goes on sale right away' : 'Saved as draft (not on sale)'}` : 'You have unsaved changes')}</div>
        ${isNew ? '' : '<button class="btn btn-del" onclick="cancelAll()">Cancel</button>'}
        <button class="btn btn-up" id="save-btn" onclick="saveAll()" ${err ? 'disabled' : ''} style="white-space:nowrap;"><i class="fa-solid fa-check"></i> ${isNew ? 'Create' : 'Save'}</button>
      </div>`;
  }

  function cancelAll() {
    draft = toDraft(saved);
    render();
  }
  function leaveNow() {
    window.onbeforeunload = null;
    blm48Back(listUrl(), { refresh: changed });
  }

  async function saveAll() {
    const err = validate();
    if (err) { renderSaveBar(); return; }
    saving = true;
    const btn = document.getElementById('save-btn');
    if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...'; }
    const col = {
      name: draft.name.trim(), description: draft.description.trim(), coverImage: draft.coverImage || null, category: composeCategory(draft.group, draft.type), group: draft.group,
      backImage: draft.backImage || null, backStyle: draft.backStyle,
      costTokens: Number(draft.costTokens), costTokensX5: draft.costTokensX5 === '' ? null : Number(draft.costTokensX5), allowX5: draft.allowX5,
      cardsPerDraw: Number(draft.cardsPerDraw) || 1,
      maxDrawsPerAccount: draft.maxDrawsPerAccount === '' ? null : Number(draft.maxDrawsPerAccount),
      saleStartAt: fromLocalInput(draft.saleStartAt), saleEndAt: fromLocalInput(draft.saleEndAt), on: draft.on
    };
    if (!saved.isLucky) {
      const p = draft.preorder;
      col.preorder = { on: p.on, timing: p.timing, deliveryInfo: p.deliveryInfo.trim(), limitStock: p.limitStock,
        bonusToken: Number(p.bonusToken) || 0, bonusGeToken: Number(p.bonusGeToken) || 0, bonusCookie: Number(p.bonusCookie) || 0 };
    }
    const items = saved.isLucky ? null : draft.items.map(i => ({
      id: i.id || null, name: i.name.trim(), imageUrl: i.imageUrl, rate: round4(Number(i.pct) || 0) / 100,
      tag: i.tag, addStock: Number(i.add) || 0
    }));
    try {
      const res = await blm48AdminSaveCollection(user.username, saved.collectionId, col, items);
      saving = false;
      if (!res || res.status !== 'success') {
        renderSaveBar();
        const b = document.getElementById('save-bar');
        b.querySelector('.save-bar-txt').innerHTML = `<span class="err"><i class="fa-solid fa-circle-exclamation"></i> ${escapeHtml((res && res.message) || 'Could not save')}</span>`;
        return;
      }
      changed = true;
      if (!saved.collectionId) {
        collectionId = res.collectionId;
        history.replaceState(history.state, '', 'admin_collection?id=' + encodeURIComponent(collectionId) + '&tab=' + tab);
      }
      window.onbeforeunload = null;
      await load();
      toast(res.message || 'Saved');
    } catch (e) {
      saving = false;
      renderSaveBar();
      toast('Cannot connect to the server, please try again');
    }
  }

  // ===== แท็บ =====
  function setTab(k) {
    tab = k;
    if (saved.collectionId) history.replaceState(history.state, '', 'admin_collection?id=' + encodeURIComponent(saved.collectionId) + '&tab=' + k);
    document.querySelectorAll('.tabs .filter-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === k));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + k));
    if (k === 'preorder') refreshShipZone();
    const tabs = document.querySelector('.tabs');
    if (tabs && tabs.getBoundingClientRect().top < 0) window.scrollTo({ top: tabs.offsetTop - 70 });
  }

  function render() {
    const isNew = !saved.collectionId;
    document.getElementById('page-title').textContent = isNew ? 'New Collection' : 'Edit Collection';
    document.title = 'BLM48 Membership | ' + (isNew ? 'New Collection' : (saved.name || 'Collection'));
    const tabs = saved.isLucky ? TABS.filter(([k]) => k === 'info' || k === 'sale') : TABS;
    shipConfirm = false;
    if (!tabs.some(([k]) => k === tab)) tab = 'info';
    document.getElementById('root').innerHTML = `
      <div class="col-head" id="col-head"></div>
      <div class="tabs">${tabs.map(([k, label]) => `<button type="button" class="filter-tab ${k === tab ? 'active' : ''}" data-tab="${k}" onclick="setTab('${k}')">${label}<span class="t-dot" aria-hidden="true"></span></button>`).join('')}</div>
      <div class="tab-pane ${tab === 'info' ? 'active' : ''}" id="pane-info"></div>
      <div class="tab-pane ${tab === 'sale' ? 'active' : ''}" id="pane-sale"></div>
      <div class="tab-pane ${tab === 'cards' ? 'active' : ''}" id="pane-cards"></div>
      <div class="tab-pane ${tab === 'stock' ? 'active' : ''}" id="pane-stock"></div>
      <div class="tab-pane ${tab === 'preorder' ? 'active' : ''}" id="pane-preorder"></div>`;
    renderInfo();
    renderSale();
    if (!saved.isLucky) { renderCards(); renderStock(); renderPreorder(); }
    renderSaveBar();
  }

  // ----- Info -----
  function renderInfo() {
    const isNew = !saved.collectionId;
    const coverStyle = draft.coverImage ? `style="background-image:url('${escapeAttr(draft.coverImage)}')"` : '';
    document.getElementById('pane-info').innerHTML = `
      ${saved.isLucky ? '<div class="msg ok">Lucky Box draws from old collections\' stock · only info, price and sale time can be edited</div>' : ''}
      <div class="form-field">
        <label>Cover image (shown in Shop)</label>
        <div class="cover-edit">
          <div class="cover-box ${draft.coverImage ? 'has' : ''}" ${coverStyle}>${draft.coverImage ? '' : '<i class="fa-regular fa-image"></i>'}</div>
          <div>
            <button type="button" class="btn-mini" onclick="pickImage('cover')"><i class="fa-solid fa-upload"></i> ${draft.coverImage ? 'Change' : 'Upload'}</button>
            <div class="note" style="margin-top:6px;">Square image, up to 5MB</div>
          </div>
        </div>
      </div>
      ${saved.isLucky ? '' : `<div class="form-field">
        <label>Card back image (3D viewer, when flipped)</label>
        <div class="cover-edit">
          <div class="cover-box back-box ${draft.backImage ? 'has' : ''} ${draft.backStyle === 'shape' ? 'is-shape' : ''}" ${draft.backImage ? `style="background-image:url('${escapeAttr(draft.backImage)}')"` : ''}>${draft.backImage ? '' : '<i class="fa-solid fa-rotate"></i>'}</div>
          <div>
            <button type="button" class="btn-mini" onclick="pickImage('back')"><i class="fa-solid fa-upload"></i> ${draft.backImage ? 'Change' : 'Upload'}</button>
            ${draft.backImage ? `<button type="button" class="btn-mini" onclick="draft.backImage = ''; renderInfo(); renderSaveBar();">Remove</button>` : ''}
            <div class="seg" style="margin-top:8px;">
              <button type="button" class="${draft.backStyle !== 'shape' ? 'active' : ''}" onclick="setField('backStyle', 'card'); renderInfo();">Rectangle card</button>
              <button type="button" class="${draft.backStyle === 'shape' ? 'active' : ''}" onclick="setField('backStyle', 'shape'); renderInfo();">Image shape (transparent PNG)</button>
            </div>
            <div class="note" style="margin-top:4px;">Used for every card in this collection · empty = yellow back with logo</div>
          </div>
        </div>
      </div>`}
      <div class="form-field"><label>Collection name</label><input type="text" maxlength="120" value="${escapeAttr(draft.name)}" oninput="setField('name', this.value, true)"></div>
      <div class="form-field"><label>Description</label><textarea maxlength="400" oninput="setField('description', this.value, true)">${escapeHtml(draft.description)}</textarea></div>
      <div class="form-field"><label>Group</label>
        <div class="seg">${GROUPS.map(([k, label]) => `<button type="button" class="${draft.group === k ? 'active' : ''}" onclick="setField('group', '${k}'); renderInfo();">${label}</button>`).join('')}</div>
        <div class="note">${draft.group === 'Both' ? 'Shows under both BLM48 and NPT48 in Inventory and Collection Book' : `Shows under ${draft.group} in Inventory and Collection Book`}</div>
      </div>
      <div class="form-field"><label>Category</label>
        <select onchange="setField('type', this.value)">${typeOptions().map(c =>
          `<option value="${escapeAttr(c)}"${c === draft.type ? ' selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select>
      </div>
      <div class="field-label">Shop preview</div>
      <div id="preview"></div>
      ${!isNew && !saved.isLucky ? `<div class="del-zone" id="del-zone">${delZoneHtml()}</div>` : ''}`;
    renderPreview();
  }

  function renderPreview() {
    const el = document.getElementById('preview');
    if (!el) return;
    const img = draft.coverImage ? `style="background-image:url('${escapeAttr(draft.coverImage)}')"` : '';
    el.innerHTML = `<div class="preview">
        <div class="preview-img" ${img}></div>
        <div class="preview-body">
          <div class="preview-name">${escapeHtml(draft.name || 'Collection name')}</div>
          <div class="preview-desc">${escapeHtml(draft.description || 'Limited collection - draw for a chance at rare members')}</div>
          <div class="preview-btns"><span><i class="fa-solid fa-coins"></i> ${fmt(draft.costTokens)} · x1</span>${draft.allowX5 ? `<span><i class="fa-solid fa-coins"></i> ${fmt(draft.costTokensX5)} · x5</span>` : ''}</div>
        </div>
      </div>`;
  }

  function delZoneHtml() {
    return saved.sold > 0
      ? `<div class="note">${fmt(saved.sold)} sold, so it cannot be deleted · to stop selling, turn off "On sale" in the Sale tab</div>`
      : '<button type="button" class="btn-danger" onclick="askDelete()"><i class="fa-solid fa-trash"></i> Delete Collection</button>';
  }

  function setField(k, v, preview) {
    draft[k] = v;
    if (preview) renderPreview();
    renderSaveBar();
  }

  // ----- Price & Time -----
  function renderSale() {
    const startPast = draft.saleStartAt && new Date(draft.saleStartAt) <= new Date();
    let hint;
    if (!draft.on) hint = 'Off · fans cannot see this collection in Shop yet';
    else if (draft.saleStartAt && !startPast) hint = `Shows in Shop as "Coming Soon" and opens for draws at ${fmtDate(fromLocalInput(draft.saleStartAt))}`;
    else hint = 'Fans can see and draw right after saving' + (draft.saleStartAt ? '' : ' (start time is set to now and an "on sale" notification is sent)');
    document.getElementById('pane-sale').innerHTML = `
      <div class="sale-switch">
        <div class="txt">
          <b>On sale</b>
          <div class="note" style="margin-top:3px;">${escapeHtml(hint)}</div>
        </div>
        <button type="button" class="switch ${draft.on ? 'on' : ''}" role="switch" aria-checked="${draft.on}" aria-label="On sale" onclick="toggleOn()"></button>
      </div>
      <div class="section-title">Price (Token)</div>
      <div class="row2">
        <div class="form-field"><label>Draw x1</label><input type="number" inputmode="numeric" min="0" step="1" value="${escapeAttr(draft.costTokens)}" oninput="setField('costTokens', this.value, true)"></div>
        <div class="form-field"><label>Draw x5</label><input type="number" inputmode="numeric" min="0" step="1" value="${escapeAttr(draft.costTokensX5)}" ${draft.allowX5 ? '' : 'disabled'} oninput="setField('costTokensX5', this.value, true)"></div>
      </div>
      <label class="note" style="display:flex;align-items:center;gap:8px;font-size:13px;color:#444;margin:-2px 0 12px;">
        <input type="checkbox" ${draft.allowX5 ? 'checked' : ''} onchange="draft.allowX5 = this.checked; renderSale(); renderPreview(); renderSaveBar();"> Allow x5 draws
        ${draft.allowX5 && draft.costTokens !== '' ? `<span class="note">(5 single draws = ${fmt(Number(draft.costTokens) * 5)})</span>` : ''}
      </label>
      <div class="form-field"><label>Cards per draw</label><input type="number" inputmode="numeric" min="1" max="10" step="1" value="${escapeAttr(draft.cardsPerDraw)}" oninput="setField('cardsPerDraw', this.value)"><div class="note" style="margin-top:3px;">How many different cards one draw gives (e.g. 2 = random 2 cards per draw)</div></div>
      <div class="form-field"><label>Draw limit per account</label><input type="number" inputmode="numeric" min="1" step="1" placeholder="No limit" value="${escapeAttr(draft.maxDrawsPerAccount)}" oninput="setField('maxDrawsPerAccount', this.value)"></div>
      <div class="section-title">Sale time</div>
      ${['saleStartAt', 'saleEndAt'].map(k => `
      <div class="form-field">
        <label class="label-row">${k === 'saleStartAt' ? 'Sale start' : 'Sale end'}${draft[k] ? `<button type="button" class="link-btn" onclick="setField('${k}', ''); renderSale();">Clear</button>` : ''}</label>
        <input type="datetime-local" value="${escapeAttr(draft[k])}" onchange="setField('${k}', this.value); renderSale();">
      </div>`).join('')}
      <div class="note">Empty "Sale end" = sells until turned off or sold out · times are in this device's time zone</div>`;
  }

  function toggleOn() {
    draft.on = !draft.on;
    renderSale();
    renderSaveBar();
  }

  // ----- Cards -----
  let cardFilter = 'all'; // all | normal | ssr
  function rateSumHtml() {
    const t = totals();
    const pctOk = Math.abs(t.pct - 100) < 0.01;
    return `<span>${fmt(draft.items.length)} cards · SSR ${fmt(t.ssr)}</span>
        <span>Total rate <b class="${pctOk ? 'good' : 'bad'}">${t.pct}%</b>${pctOk || !draft.items.length ? '' : ' · should add up to 100%'}</span>
        <span>SSR total <b>${t.ssrPct}%</b></span>`;
  }
  function setCardFilter(k) { cardFilter = k; renderCards(); }

  function renderCards() {
    const t = totals();
    const names = draft.items.map(i => i.name.trim().toLowerCase());
    const FILTERS = [['all', 'All', () => true], ['normal', 'Normal', i => i.tag !== 'SSR'], ['ssr', 'SSR', i => i.tag === 'SSR']];
    if (!t.ssr) cardFilter = 'all';
    const shown = draft.items.filter(FILTERS.find(([k]) => k === cardFilter)[2]);
    document.getElementById('pane-cards').innerHTML = `
      <div class="rate-sum">${rateSumHtml()}</div>
      <div class="tools-row">
        <button type="button" class="${draft.items.length ? 'btn-mini' : 'btn btn-up'}" onclick="document.getElementById('file-many').click()"><i class="fa-solid fa-images"></i> Upload images</button>
        <button type="button" class="btn-mini" onclick="addCardRow()"><i class="fa-solid fa-plus"></i> Add card</button>
        <button type="button" class="btn-mini btn-pb-pick" onclick="pickPhotobook(this)"><i class="fa-solid fa-book"></i> Photobook</button>
        <button type="button" class="btn-mini" onclick="toggleBox('auto-box')" ${draft.items.length ? '' : 'disabled'}><i class="fa-solid fa-percent"></i> Auto rates</button>
      </div>
      <div class="auto-box" id="auto-box">
        <div class="note" style="margin-bottom:8px;">Enter the total SSR rate. It is split evenly across SSR cards, and the rest is split evenly across normal cards</div>
        <div class="inline-row"><input type="number" id="auto-ssr" min="0" max="100" step="0.01" value="${t.ssr ? (t.ssrPct || 2) : 0}" ${t.ssr ? '' : 'disabled'}><span class="note">% SSR total</span>
          <button type="button" class="btn btn-up" onclick="autoRates()">Apply</button></div>
        ${t.ssr ? '' : '<div class="note" style="margin-top:6px;">No SSR cards yet · tap SSR on a card first if you need one</div>'}
      </div>
      ${t.ssr ? `<div class="seg">${FILTERS.map(([k, label, fn]) => `<button type="button" class="${k === cardFilter ? 'active' : ''}" onclick="setCardFilter('${k}')">${label} <span>${draft.items.filter(fn).length}</span></button>`).join('')}</div>` : ''}
      <div id="card-list">${draft.items.length ? shown.map(i => cardHtml(i, names)).join('')
        : `<div class="empty-cards"><i class="fa-regular fa-images"></i><b>No cards yet</b>
             Pick all card images at once with "Upload images" · card names come from file names, and files starting with SSR get the SSR tag</div>`}</div>
      <div class="note" style="margin-top:10px;">Real rates only count cards with stock left; when a card runs out, the others go up in proportion · sold cards cannot be deleted or renamed</div>`;
  }

  function cardHtml(i, names) {
    const dup = i.name.trim() && names.filter(n => n === i.name.trim().toLowerCase()).length > 1;
    const add = Number(i.add) || 0;
    const img = i.imageUrl ? `style="background-image:url('${escapeAttr(i.imageUrl)}')"` : '';
    return `
      <div class="card-row ${dup ? 'dup' : ''}" data-key="${i.key}">
        <div class="card-thumb ${i.imageUrl ? 'has' : ''}" ${img} onclick="pickImage('${i.key}')" title="Change image">
          ${i.imageUrl ? '' : '<i class="fa-regular fa-image"></i>'}${i.tag === 'SSR' ? '<span class="ssr-badge">SSR</span>' : ''}
        </div>
        <div class="card-main">
          <div class="card-top">
            <input type="text" data-f="name" maxlength="120" placeholder="Card name, e.g. Bumblebee - New Ship" value="${escapeAttr(i.name)}" ${i.sold > 0 ? 'readonly title="Sold, cannot rename"' : ''} oninput="setCard('${i.key}', 'name', this.value)">
            <button type="button" class="ssr-toggle ${i.tag === 'SSR' ? 'on' : ''}" onclick="toggleSsr('${i.key}')">SSR</button>
            <button type="button" class="icon-btn" onclick="removeCard('${i.key}')" ${i.sold > 0 ? 'disabled title="Sold, cannot delete"' : 'title="Delete card"'} aria-label="Delete card"><i class="fa-solid fa-trash"></i></button>
          </div>
          <div class="card-fields">
            <label>Rate <input type="number" min="0" step="0.01" inputmode="decimal" value="${escapeAttr(i.pct)}" oninput="setCard('${i.key}', 'pct', this.value)"> %</label>
            <label>${i.id ? 'Left' : 'Stock'} <input type="number" min="0" step="1" inputmode="numeric" class="stock-add ${add ? 'changed' : ''}" data-remain="${i.key}" placeholder="0" value="${escapeAttr(remainValue(i))}" oninput="setRemain('${i.key}', this.value)"></label>
            ${i.id ? `<span class="stock-now">${stockNowHtml(i)}</span>` : ''}
          </div>
        </div>
      </div>`;
  }

  // ช่อง "คงเหลือ" = พิมพ์จำนวนที่ต้องการให้เหลือได้เลย แต่ส่งไปเซิร์ฟเวอร์เป็นส่วนต่าง (add)
  // จากจำนวนตอนโหลดหน้า เพื่อไม่ทับการสุ่มที่เกิดขึ้นระหว่างแก้
  function remainValue(i) {
    if (!i.id) return i.add;
    return i.add === '' ? String(i.stock) : String(Math.max(i.stock + (Number(i.add) || 0), 0));
  }
  function stockNowHtml(i) {
    const add = Number(i.add) || 0;
    return `${add ? `was <b>${fmt(i.stock)}</b> · ${add > 0 ? '+' : ''}${fmt(add)}` : `<b>${fmt(i.stock)}</b> left`} · ${fmt(i.sold)} sold`;
  }
  function setRemain(key, v) {
    const c = findCard(key);
    if (!c) return;
    if (!c.id) { setCard(key, 'add', v); return; }
    const n = Number(v);
    c.add = v === '' || !Number.isFinite(n) || n === c.stock ? '' : String(n - c.stock);
    document.querySelectorAll(`[data-remain="${key}"]`).forEach(el => { if (el !== document.activeElement) el.value = remainValue(c); });
    const row = document.querySelector(`.card-row[data-key="${key}"]`);
    if (row) {
      row.querySelector('.stock-add').classList.toggle('changed', !!Number(c.add));
      const now = row.querySelector('.stock-now');
      if (now) now.innerHTML = stockNowHtml(c);
    }
    refreshCardSummary();
    renderSaveBar();
  }
  function findCard(key) { return draft.items.find(i => i.key === key); }
  // พิมพ์ในช่อง -> ไม่วาดใหม่ทั้งรายการ (โฟกัสไม่หลุด) อัปเดตแค่สรุป/แถบบันทึก
  function setCard(key, f, v) {
    const c = findCard(key);
    if (!c) return;
    c[f] = v;
    if (f === 'add') {
      const row = document.querySelector(`.card-row[data-key="${key}"]`);
      row.querySelector('.stock-add').classList.toggle('changed', !!(Number(v) || 0));
    }
    refreshCardSummary();
    renderSaveBar();
  }
  function refreshCardSummary() {
    const el = document.querySelector('#pane-cards .rate-sum');
    if (el) el.innerHTML = rateSumHtml();
    const names = draft.items.map(i => i.name.trim().toLowerCase());
    draft.items.forEach(i => {
      const row = document.querySelector(`.card-row[data-key="${i.key}"]`);
      if (row) row.classList.toggle('dup', !!i.name.trim() && names.filter(n => n === i.name.trim().toLowerCase()).length > 1);
    });
  }
  function toggleSsr(key) {
    const c = findCard(key);
    c.tag = c.tag === 'SSR' ? null : 'SSR';
    renderCards(); renderSaveBar();
  }
  // เพิ่มเล่มจากหน้า Admin Photobook เป็นไอเทม: ใช้รูปปกหน้าของเล่ม (ระบบผูกเล่มด้วยรูปปก) คนที่ได้ไปเปิดอ่านเป็นหนังสือ 3D ได้
  function pickPhotobook(btn) {
    blm48TogglePhotobookPicker(btn, user.username, b => {
      if (draft.items.some(i => i.imageUrl === b.coverUrl)) return toast('This photobook is already in the collection');
      if (!draft.items.length && draft.type === 'Coaster') { draft.type = 'Photobook'; renderInfo(); }
      addCard(b.title, b.coverUrl);
      cardFilter = 'all';
      renderCards(); renderSaveBar();
    }, btn.parentElement);
  }
  function addCard(name, imageUrl) {
    draft.items.push({ key: 'k' + (++keySeq), id: null, name: name || '', imageUrl: imageUrl || '', pct: 0, tag: null, stock: 0, sold: 0, add: '' });
  }
  // ปุ่ม "เพิ่มการ์ด" -> แถวใหม่ท้ายรายการ เลื่อนไปหาและโฟกัสช่องชื่อ
  function addCardRow() {
    addCard();
    cardFilter = 'all';
    renderCards(); renderSaveBar();
    const row = document.querySelector(`.card-row[data-key="${draft.items[draft.items.length - 1].key}"]`);
    row.scrollIntoView({ block: 'center' });
    row.querySelector('input[data-f="name"]').focus({ preventScroll: true });
  }
  // ลบทันที (มีผลตอน Save) + ปุ่ม "เอากลับ" ใน toast แทน popup ยืนยัน
  let removed = null;
  function removeCard(key) {
    const idx = draft.items.findIndex(i => i.key === key);
    const c = draft.items[idx];
    if (!c || c.sold > 0) return;
    removed = { item: c, idx };
    draft.items.splice(idx, 1);
    renderCards(); renderSaveBar();
    toast(`Removed "${c.name || 'card'}"`, 'Undo', undoRemove);
  }
  function undoRemove() {
    if (!removed) return;
    draft.items.splice(Math.min(removed.idx, draft.items.length), 0, removed.item);
    removed = null;
    renderCards(); renderSaveBar();
  }
  function toggleBox(id) { document.getElementById(id).classList.toggle('show'); }
  function autoRates() {
    const ssr = draft.items.filter(i => i.tag === 'SSR');
    const normal = draft.items.filter(i => i.tag !== 'SSR');
    let ssrTotal = ssr.length ? Number(document.getElementById('auto-ssr').value) : 0;
    if (!(ssrTotal >= 0 && ssrTotal <= 100)) { toast('SSR % must be between 0 and 100'); return; }
    if (!normal.length) ssrTotal = 100;
    ssr.forEach(i => { i.pct = round4(ssrTotal / ssr.length); });
    normal.forEach(i => { i.pct = round4((100 - ssrTotal) / normal.length); });
    renderCards(); renderSaveBar();
    toast('Rates set · tap Save to keep them');
  }

  // ----- Stock -----
  function renderStock() {
    const t = totals();
    const pending = draft.items.filter(i => i.id && Number(i.add));
    document.getElementById('pane-stock').innerHTML = `
      <div class="rate-sum">
        <span>Total left <b>${fmt(draft.items.reduce((s, i) => s + i.stock, 0))}</b></span>
        <span>Sold <b>${fmt(saved.sold)}</b></span>
        ${pending.length ? `<span>After save <b class="good">${fmt(t.stock)}</b></span>` : ''}
      </div>
      <div class="section-title">Restock every card</div>
      <div class="inline-row" style="margin-bottom:6px;">
        <input type="number" id="bulk-add" step="1" inputmode="numeric" placeholder="+50">
        <button type="button" class="btn btn-up" onclick="bulkAdd(false)" ${draft.items.length ? '' : 'disabled'}>All cards</button>
        <button type="button" class="btn-mini" onclick="bulkAdd(true)" ${draft.items.some(i => i.tag !== 'SSR') ? '' : 'disabled'}>Normal cards only</button>
      </div>
      <div class="note">Use a negative number to reduce stock · applies when you tap Save</div>
      ${draft.items.length ? `<div class="section-title">Stock per card <span class="note">type the amount you want left · lowest first</span></div>
      <div class="stock-list">${draft.items.slice().sort((a, b) => (a.stock + (Number(a.add) || 0)) - (b.stock + (Number(b.add) || 0))).map(i => {
        const after = Math.max(i.stock + (Number(i.add) || 0), 0);
        return `<div class="stock-item ${after === 0 ? 'zero' : ''}">
          <span class="si-name">${i.tag === 'SSR' ? '<b class="ssr-tag">SSR</b> ' : ''}${escapeHtml(i.name || '(no name)')}</span>
          <span class="si-num">${Number(i.add) && i.id ? `<s>${fmt(i.stock)}</s> ` : ''}<input type="number" min="0" step="1" inputmode="numeric" class="si-input ${Number(i.add) ? 'changed' : ''}" data-remain="${i.key}" value="${escapeAttr(remainValue(i))}" placeholder="0" oninput="setRemain('${i.key}', this.value); this.classList.toggle('changed', !!Number(findCard('${i.key}').add))" aria-label="Stock left ${escapeAttr(i.name)}"></span>
        </div>`; }).join('')}</div>
      <div class="note" style="margin-top:6px;">If someone draws while you edit, the saved amount goes down by what was sold</div>` : ''}
      <div class="section-title">Stock history</div>
      ${(saved.logs || []).length ? saved.logs.map(l => `
        <div class="log-row">
          <div>${escapeHtml(l.itemName || '-')}<div class="log-meta">${escapeHtml(l.by || '')} · ${fmtDate(l.at)}</div></div>
          <div style="text-align:right;"><span class="${l.delta > 0 ? 'd-plus' : 'd-minus'}">${l.delta > 0 ? '+' : ''}${fmt(l.delta)}</span><div class="log-meta">${fmt(l.stockAfter)} left</div></div>
        </div>`).join('') : '<div class="note">No history yet</div>'}`;
  }
  function bulkAdd(normalOnly) {
    const n = Number(document.getElementById('bulk-add').value);
    if (!Number.isInteger(n) || n === 0) { toast('Enter a whole number, e.g. 50'); return; }
    draft.items.filter(i => !normalOnly || i.tag !== 'SSR').forEach(i => { i.add = String((Number(i.add) || 0) + n); });
    renderCards(); renderStock(); renderSaveBar();
    toast(`${n > 0 ? '+' : ''}${n} to ${normalOnly ? 'normal cards' : 'all cards'} · tap Save to keep it`);
  }

  // ----- Pre-order -----
  // ของสุ่มตอนซื้อ (จองสต๊อกแล้ว) แต่รอจัดส่งพร้อมกัน · โบนัสต่อการสุ่ม 1 ครั้ง (×5 = 5 เท่า)
  let shipConfirm = false;
  let shipping = false;

  function bonusSummary(p) {
    const parts = BONUS_FIELDS.filter(([k]) => Number(p[k]) > 0).map(([k, label]) => `+${fmt(p[k])} ${label}`);
    return parts.join(', ');
  }
  function preorderPreviewHtml() {
    const p = draft.preorder;
    const b = bonusSummary(p);
    return `<b>Buyers see:</b> Pre-order${p.deliveryInfo.trim() ? ` · ${escapeHtml(p.deliveryInfo.trim())}` : ''}${b
      ? ` · bonus ${escapeHtml(b)} per draw, ${p.timing === 'purchase' ? 'in the wallet right after purchase' : 'in the wallet when the order ships'}`
      : ' · no bonus'}`;
  }

  function renderPreorder() {
    const el = document.getElementById('pane-preorder');
    if (!el) return;
    const p = draft.preorder;
    const s = saved.preorder || {};
    const opt = (k, title, sub) => `
      <button type="button" class="pre-opt ${p.timing === k ? 'active' : ''}" role="radio" aria-checked="${p.timing === k}" onclick="setPre('timing', '${k}'); renderPreorder();">
        <i class="fa-${p.timing === k ? 'solid fa-circle-dot' : 'regular fa-circle'}"></i>
        <span><b>${title}</b><span class="note">${sub}</span></span>
      </button>`;
    el.innerHTML = `
      <div class="sale-switch">
        <div class="txt">
          <b>Sell as pre-order</b>
          <div class="note" style="margin-top:3px;">${p.on
            ? 'Buyers pay now · cards are drawn when you tap "Mark all as shipped" · cards, images and stock can be added any time before shipping'
            : 'Off · items go to the buyer right after they Redeem, like a normal collection'}</div>
        </div>
        <button type="button" class="switch ${p.on ? 'on' : ''}" role="switch" aria-checked="${p.on}" aria-label="Sell as pre-order" onclick="setPre('on', !draft.preorder.on); renderPreorder();"></button>
      </div>
      ${p.on ? `
      <div class="sale-switch">
        <div class="txt">
          <b>Limit orders by stock</b>
          <div class="note" style="margin-top:3px;">${p.limitStock
            ? `Orders stop (Sold Out) when the card stock runs out${saved.collectionId && s.available !== undefined ? ` · <b>${fmt(Math.max(Number(s.available) || 0, 0))}</b> cards left to sell` : ''}${saved.collectionId && s.on && s.limitStock !== false && !(Number(s.available) > 0) ? ' · add stock in the Cards or Stock tab to start selling' : ''}`
            : 'Off · no limit, buyers can order even with no cards or stock yet'}</div>
        </div>
        <button type="button" class="switch ${p.limitStock ? 'on' : ''}" role="switch" aria-checked="${p.limitStock}" aria-label="Limit orders by stock" onclick="setPre('limitStock', !draft.preorder.limitStock); renderPreorder();"></button>
      </div>
      <div class="form-field"><label>Delivery (shown to buyers)</label>
        <input type="text" maxlength="120" placeholder="e.g. Ships 25 Dec 2026" value="${escapeAttr(p.deliveryInfo)}" oninput="setPre('deliveryInfo', this.value)"></div>
      <div class="section-title">Bonus with every draw</div>
      <div class="bonus-grid">${BONUS_FIELDS.map(([k, label, icon]) => `
        <label class="bonus-field"><span><i class="fas ${icon}"></i> ${label}</span>
          <input type="number" min="0" step="1" inputmode="numeric" placeholder="0" value="${escapeAttr(p[k])}" oninput="setPre('${k}', this.value)" aria-label="${label} bonus per draw"></label>`).join('')}</div>
      <div class="note" style="margin:-4px 0 12px;">Per draw · Draw ×5 gives 5 times the bonus · leave empty for no bonus</div>
      <div class="section-title">When buyers get the bonus</div>
      <div class="pre-opts" role="radiogroup" aria-label="When buyers get the bonus">
        ${opt('purchase', 'Right after purchase', 'Goes into the wallet at checkout · the goods still wait to ship')}
        ${opt('ship', 'With the shipment', 'Goes into the wallet together with the goods when the buyer Redeems after you ship')}
      </div>
      <div class="pre-preview" id="pre-preview">${preorderPreviewHtml()}</div>` : ''}
      ${saved.collectionId && (s.on || s.waitingLines > 0 || s.shippedLines > 0) ? `
      <div class="section-title">Shipping</div>
      <div class="rate-sum">
        <span>Waiting <b>${fmt(s.waitingOrders)}</b> orders</span>
        <span>Buyers <b>${fmt(s.waitingBuyers)}</b></span>
        <span>Draws <b>${fmt(s.waitingDraws)}</b></span>
        ${s.shippedLines ? `<span>Shipped <b class="good">${fmt(s.shippedLines)}</b> lines</span>` : ''}
      </div>
      ${s.shippedAt ? `<div class="note" style="margin-bottom:8px;">Last shipped ${fmtDate(s.shippedAt)}</div>` : ''}
      <div id="ship-zone">${shipZoneHtml()}</div>` : ''}`;
  }

  function shipZoneHtml() {
    const s = saved.preorder || {};
    if (!s.waitingLines) return '<div class="note">No orders waiting to ship</div>';
    if (isDirty()) return '<div class="note">Save or cancel your changes first, then mark as shipped</div>';
    if (shipConfirm) return `
      <div class="confirm-box ship"><b>Mark ${fmt(s.waitingOrders)} orders (${fmt(s.waitingDraws)} draws) as shipped?</b>
        Buyers get a notification and can Redeem their items${(saved.preorder.timing === 'ship' && bonusSummary(toPreorderDraft(saved.preorder))) ? ' and bonus' : ''} right away · this cannot be undone
        <div id="ship-msg" style="margin-top:6px;"></div>
        <div class="confirm-actions">
          <button type="button" class="btn-cancel" onclick="shipConfirm = false; refreshShipZone();">Cancel</button>
          <button type="button" class="btn-ship" id="ship-btn" onclick="shipAll()">Ship now</button>
        </div>
      </div>`;
    return `<button type="button" class="btn btn-up btn-wide" onclick="shipConfirm = true; refreshShipZone();"><i class="fa-solid fa-truck-fast"></i> Mark all as shipped</button>`;
  }
  function refreshShipZone() {
    const z = document.getElementById('ship-zone');
    if (z) z.innerHTML = shipZoneHtml();
  }

  // พิมพ์ในช่อง -> ไม่วาดใหม่ทั้งแท็บ (โฟกัสไม่หลุด)
  function setPre(k, v) {
    draft.preorder[k] = v;
    const pv = document.getElementById('pre-preview');
    if (pv) pv.innerHTML = preorderPreviewHtml();
    renderSaveBar();
    refreshShipZone();
  }

  async function shipAll() {
    if (shipping) return;
    shipping = true;
    const btn = document.getElementById('ship-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      const res = await blm48AdminShipCollectionPreorder(user.username, saved.collectionId);
      shipping = false;
      if (res && res.status === 'success') {
        shipConfirm = false;
        changed = true;
        await load();
        toast(res.message || 'Shipped');
        return;
      }
      document.getElementById('ship-msg').textContent = (res && res.message) || 'Could not ship';
    } catch (e) {
      shipping = false;
      document.getElementById('ship-msg').textContent = 'Cannot connect to the server, please try again';
    }
    btn.disabled = false;
    btn.textContent = 'Ship now';
  }

  // ===== อัปโหลดรูป =====
  function pickImage(target) {
    uploadTarget = target;
    document.getElementById('file-one').click();
  }
  function prefix() { return 'collection-' + (saved.collectionId || 'new'); }

  document.getElementById('file-one').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/') || file.size > MAX_IMAGE_BYTES) { toast('Please choose an image up to 5MB'); return; }
    toast('Uploading...');
    try {
      const url = await blm48UploadImageToBucket('app-assets', prefix(), file);
      if (uploadTarget === 'cover') { draft.coverImage = url; renderInfo(); }
      else if (uploadTarget === 'back') { draft.backImage = url; renderInfo(); }
      else { const c = findCard(uploadTarget); if (c) c.imageUrl = url; renderCards(); }
      renderSale();
      renderSaveBar();
      toast('Uploaded · tap Save to keep it');
    } catch (err) {
      console.error('Collection image upload error:', err);
      toast('Upload failed, please try again');
    }
  });

  // หลายรูป -> การ์ดใหม่ทีละใบ ชื่อจากชื่อไฟล์ (ชื่อที่ขึ้นต้นด้วย SSR = ติด SSR ให้)
  document.getElementById('file-many').addEventListener('change', async e => {
    const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
    e.target.value = '';
    if (!files.length) return;
    const big = files.filter(f => f.size > MAX_IMAGE_BYTES).length;
    const ok = files.filter(f => f.size <= MAX_IMAGE_BYTES).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    let done = 0, failed = 0;
    for (const f of ok) {
      toast(`Uploading ${done + failed + 1}/${ok.length}...`);
      try {
        const url = await blm48UploadImageToBucket('app-assets', prefix(), f);
        const name = f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();
        addCard(name, url);
        if (/^ssr\b/i.test(name)) draft.items[draft.items.length - 1].tag = 'SSR';
        done++;
      } catch (err) {
        console.error('Collection image upload error:', err);
        failed++;
      }
    }
    renderCards(); renderStock(); renderSaveBar();
    toast(`Added ${done} cards${failed ? ` · ${failed} failed` : ''}${big ? ` · skipped ${big} images over 5MB` : ''}`);
  });

  // ===== ลบคอลเลกชัน (เฉพาะที่ยังไม่มีคนซื้อ) =====
  function askDelete() {
    document.getElementById('del-zone').innerHTML = `
      <div class="confirm-box"><b>Permanently delete “${escapeHtml(saved.name || saved.collectionId)}” and all its cards?</b> This cannot be undone
        <div id="del-msg" style="margin-top:6px;"></div>
        <div class="confirm-actions">
          <button type="button" class="btn-cancel" onclick="document.getElementById('del-zone').innerHTML = delZoneHtml()">Cancel</button>
          <button type="button" class="btn-confirm-del" id="del-btn" onclick="deleteCollection()">Delete</button>
        </div>
      </div>`;
  }
  async function deleteCollection() {
    const btn = document.getElementById('del-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
      const res = await blm48AdminDeleteCollection(user.username, saved.collectionId);
      if (res && res.status === 'success') {
        changed = true; window.onbeforeunload = null; draft = toDraft(saved);
        blm48Back(listUrl(), { refresh: true });
        return;
      }
      document.getElementById('del-msg').textContent = (res && res.message) || 'Could not delete';
    } catch (e) {
      document.getElementById('del-msg').textContent = 'Cannot connect to the server, please try again';
    }
    btn.disabled = false;
    btn.textContent = 'Delete';
  }

  window.addEventListener('DOMContentLoaded', async () => {
    user = getUserSession();
    if (!user) { window.location.href = 'login'; return; }
    if (!(user.is_admin === true || (user.role && ['admin','ceo'].includes(user.role.toLowerCase())))) {
      document.getElementById('access-denied').style.display = 'block';
      return;
    }
    document.getElementById('page-content').style.display = 'block';
    load();
  });
</script>
</body>
</html>
